<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영어 문장 변신시키기</title>
<style>
:root{--ink:#29364a;--violet:#675d91;--pale:#efedf7;--cream:#f7f6f1;--red:#a4514c;--green:#477a68;--gold:#b38d29}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,"Malgun Gothic",sans-serif}.wrap{width:min(900px,100%);margin:auto;padding:42px 18px 70px}header{margin-bottom:22px}.eyebrow{color:var(--violet);font-size:12px;font-weight:800;letter-spacing:.18em}h1{font-size:30px;margin:7px 0 5px;letter-spacing:-.04em}header p{margin:0;color:#7b8783}.card{background:#fff;border:1px solid #e3e5e4;border-radius:28px;padding:30px 36px 32px;box-shadow:0 18px 50px #4d5b5212;text-align:center}.progress{display:flex;justify-content:space-between;color:#718096;font-size:14px;font-weight:700}.progress strong{color:var(--violet)}.track{height:6px;background:#edf0ee;border-radius:20px;margin:12px 0 30px;overflow:hidden}.track i{display:block;height:100%;background:var(--violet);border-radius:20px}.mission{display:inline-block;background:var(--pale);color:var(--violet);padding:7px 13px;border-radius:20px;font-size:13px;font-weight:800}.before{max-width:720px;margin:16px auto 13px;border:1px solid #dedbe9;background:#faf9fd;border-radius:17px;padding:17px}.before small{display:block;color:#8a849f;font-weight:700;margin-bottom:7px}.before strong{font-size:23px}.arrow{font-size:25px;color:#aaa3bf;margin:2px}.target{font-size:17px;font-weight:700;margin:9px 0 25px;color:#5e6876}.target span{color:var(--violet)}form{max-width:720px;margin:auto}.inputbox{position:relative}input{width:100%;height:64px;border:2px solid #cbd1d8;border-radius:16px;padding:0 58px 0 18px;font-size:20px;color:var(--ink);outline:none;background:#fafcfb}input:focus{border-color:#8d83b0;box-shadow:0 0 0 4px #e8e4f566}.submit{position:absolute;right:9px;top:9px;width:46px;height:46px;border:0;border-radius:12px;background:var(--violet);color:#fff;font-size:23px;font-weight:bold;cursor:pointer}.guide{font-size:13px;color:#97a19e;margin:11px 0 0}.feedback{min-height:48px;display:flex;justify-content:center;align-items:center;gap:9px;font-weight:700;color:#71807b}.feedback.error{color:var(--red)}.feedback.success{color:var(--green)}.feedback b{width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:#f0eef5}.hint{margin:10px auto 4px;padding:17px;border-radius:17px;background:#f6f1e3;border:1px solid #eadfbf;max-width:720px}.hint strong{display:block;font-size:13px;color:#8e742e;margin-bottom:11px}.words{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.words span{background:#fff;border:1px solid #dfd4b7;border-radius:11px;padding:8px 11px;font-size:16px;font-weight:700}.attempts{font-size:13px;color:#9aa29f;margin-top:18px}.finish{padding:50px 12px}.star{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:#f5e9bd;color:var(--gold);font-size:44px}.finish small{color:var(--gold);font-weight:800;letter-spacing:.18em}.finish h2{font-size:30px;margin:9px 0}.finish p{color:#718096}.restart{border:0;background:var(--violet);color:#fff;border-radius:13px;padding:13px 25px;font-size:15px;font-weight:800;margin-top:10px}@media(max-width:650px){.wrap{padding:24px 13px}.card{padding:23px 16px;border-radius:22px}h1{font-size:25px}.before strong{font-size:19px}.target{font-size:15px}input{height:60px;font-size:17px}.submit{top:7px}}
</style></head><body><main class="wrap"><header><span class="eyebrow">SENTENCE TRANSFORMER</span><h1>영어 문장 변신시키기</h1><p>지시에 맞게 문장을 바꾸어 입력하세요.</p></header><section class="card" id="app"></section></main>
<script>
const questions=[
 {mission:"부정문으로 바꾸기",before:"My classroom is clean.",target:"나의 교실은 깨끗하지 않다.",answer:"My classroom is not clean."},
 {mission:"긍정문으로 바꾸기",before:"My classroom is not dirty.",target:"나의 교실은 더럽다.",answer:"My classroom is dirty."},
 {mission:"여러 명으로 바꾸기",before:"She is my classmate.",target:"그들은 나의 학급 친구들이다.",answer:"They are my classmates."},
 {mission:"한 명으로 바꾸기",before:"They are my classmates.",target:"그녀는 나의 학급 친구이다.",answer:"She is my classmate."},
 {mission:"‘매일’을 추가하기",before:"She is late for school.",target:"그녀는 매일 학교에 늦는다.",answer:"She is late for school every day."},
 {mission:"‘매일’을 빼기",before:"She is late for school every day.",target:"그녀는 학교에 늦는다.",answer:"She is late for school."},
 {mission:"과목을 영어로 바꾸기",before:"His favorite subject is art.",target:"그가 가장 좋아하는 과목은 영어이다.",answer:"His favorite subject is English."},
 {mission:"과목을 수학으로 바꾸기",before:"His favorite subject is English.",target:"그가 가장 좋아하는 과목은 수학이다.",answer:"His favorite subject is math."},
 {mission:"부정문으로 바꾸기",before:"Our classroom is small.",target:"우리 교실은 작지 않다.",answer:"Our classroom is not small."},
 {mission:"긍정문으로 바꾸기",before:"Our classroom is not small.",target:"우리 교실은 작다.",answer:"Our classroom is small."}
];
let index=0,tries=0,locked=false;const app=document.querySelector("#app");
function clean(s){return s.trim().toLowerCase().replace(/[.!?]+$/,"").replace(/\s+/g," ")}
function shuffledWords(){let a=questions[index].answer.replace(/[.!?]$/,"").split(" ");for(let i=a.length-1;i>0;i--){const j=(i*7+index*3+tries)%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function render(message="바뀐 문장을 직접 입력해 보세요.",state=""){
 const q=questions[index];const hint=tries>=3?'<div class="hint"><strong>💡 단어 힌트 — 올바른 순서로 문장을 완성하세요.</strong><div class="words">'+shuffledWords().map(w=>'<span>'+w+'</span>').join("")+'</div></div>':"";
 app.innerHTML='<div class="progress"><span>문장 변신</span><strong>'+(index+1)+' / '+questions.length+'</strong></div><div class="track"><i style="width:'+((index+1)/questions.length*100)+'%"></i></div><span class="mission">'+q.mission+'</span><div class="before"><small>바꾸기 전 문장</small><strong>'+q.before+'</strong></div><div class="arrow">↓</div><div class="target">완성할 뜻: <span>'+q.target+'</span></div><form id="answerForm" autocomplete="off"><div class="inputbox"><input id="answer" type="text" name="transform_'+Date.now()+'" aria-label="바뀐 영어 문장 입력" placeholder="바뀐 영어 문장을 입력하세요" autocomplete="new-password" autocorrect="off" autocapitalize="none" spellcheck="false"><button class="submit" type="submit" aria-label="정답 확인">↵</button></div><p class="guide">마침표와 대소문자는 채점에 영향을 주지 않아요.</p></form><div class="feedback '+state+'"><b>'+(state==="error"?"↻":state==="success"?"✓":"✦")+'</b>'+message+'</div>'+hint+'<div class="attempts">현재 문제 오답 횟수: '+tries+'회</div>';
 const input=document.querySelector("#answer");input.readOnly=true;setTimeout(()=>{input.readOnly=false;input.focus()},60);document.querySelector("#answerForm").onsubmit=check}
function check(e){e.preventDefault();if(locked)return;const value=clean(document.querySelector("#answer").value);if(!value)return;if(value===clean(questions[index].answer)){locked=true;render("정답이에요! 문장 변신 성공! 🎉","success");setTimeout(()=>{if(index===questions.length-1)finish();else{index++;tries=0;locked=false;render()}},950)}else{tries++;render(tries>=3?"단어 힌트를 참고해 다시 문장을 바꾸어 보세요.":"어떤 부분이 바뀌어야 하는지 다시 생각해 보세요.","error")}}
function finish(){app.innerHTML='<div class="finish"><div class="star">★</div><small>TRANSFORM COMPLETE</small><h2>10개의 문장을 모두 변신시켰어요!</h2><p>긍정·부정, 한 명·여러 명 표현을 잘 익혔어요.</p><button class="restart">처음부터 다시 하기</button></div>';document.querySelector(".restart").onclick=()=>{index=0;tries=0;locked=false;render()}}render();
</script></body></html>
