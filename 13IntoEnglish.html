<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리말 보고 영어 문장 쓰기</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px;background:radial-gradient(circle at top,#f8fbfa,#eaf1ef 62%,#e1eae7);font-family:Arial,"Noto Sans KR",sans-serif;color:#24332e}
.app{max-width:760px;margin:auto;background:#fff;border:1px solid #dbe5e1;border-radius:32px;overflow:hidden;box-shadow:0 18px 50px #526d6324}header{padding:28px 38px;background:#315a58;color:#fff}.tag{margin:0;color:#ccecea;font-size:13px;font-weight:900;letter-spacing:.18em}h1{margin:7px 0 0;font-size:35px}header p:last-child{margin:8px 0 0;color:#dcebea}
.body{padding:36px 38px}.center{min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.emoji{font-size:58px;width:104px;height:104px;display:grid;place-items:center;border-radius:50%;background:#e7f3f1}h2{margin:20px 0 9px;font-size:29px}.note{max-width:460px;margin:0;color:#687872;line-height:1.7}
button{font:inherit;cursor:pointer}.start,.restart{margin-top:27px;border:0;border-radius:18px;padding:16px 38px;background:#dd7655;color:#fff;font-size:18px;font-weight:900}.restart{background:#315a58}
.top{display:flex;align-items:center;gap:16px;margin-bottom:28px}.bar{height:10px;flex:1;overflow:hidden;border-radius:99px;background:#e2ebe8}.fill{height:100%;background:#dd7655;transition:width .3s}.count{white-space:nowrap;color:#64756f;font-weight:900}
.prompt{min-height:190px;border-radius:25px;background:#eef6f4;padding:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.prompt small{color:#70837c;font-weight:800}.korean{margin:13px 0 0;color:#254c49;font-size:27px;font-weight:900;line-height:1.45;word-break:keep-all}
.hint{margin-top:18px;padding:17px;border:1px solid #efcd86;border-radius:19px;background:#fff8e7;text-align:center;color:#845514}.hint p{margin:0;font-weight:800}.words{margin-top:10px!important;font-size:17px;line-height:1.8;color:#a15e25;overflow-wrap:anywhere}
form{margin-top:24px}label{display:block;margin-bottom:8px;color:#52635d;font-size:14px;font-weight:850}.row{display:flex;gap:9px}input{min-width:0;flex:1;height:60px;border:2px solid #c7d5d1;border-radius:18px;padding:0 18px;font-size:19px;font-weight:750;outline:none}input:focus{border-color:#327974;box-shadow:0 0 0 4px #32797420}.submit{width:67px;border:0;border-radius:18px;background:#dd7655;color:#fff;font-size:28px;font-weight:900}
.message{min-height:30px;margin-top:15px;text-align:center;font-weight:900}.right{color:#168c68}.wrong{color:#da4f62}.tries{text-align:center;color:#8a9792;font-size:12px}.hidden{display:none!important}.party{font-size:74px}
@media(max-width:560px){body{padding:0}.app{min-height:100vh;border:0;border-radius:0}header{padding:23px}.body{padding:25px 19px}h1{font-size:29px}.korean{font-size:23px}input{font-size:17px;padding:0 14px}}
</style>
</head>
<body>
<main class="app">
<header><p class="tag">KOREAN → ENGLISH</p><h1>우리말 보고 영어 문장 쓰기</h1><p>우리말 문장을 영어로 바르게 입력하세요.</p></header>
<section class="body">
  <div id="intro" class="center"><div class="emoji">⌨️</div><h2>영작 연습을 시작해요!</h2><p class="note">우리말을 읽고 영어 문장 전체를 입력한 뒤 Enter를 누르세요. 세 번 틀리면 섞인 단어 힌트가 나타납니다.</p><button class="start" onclick="start()">학습 시작</button></div>
  <div id="game" class="hidden">
    <div class="top"><div class="bar"><div id="fill" class="fill"></div></div><span id="count" class="count"></span></div>
    <div class="prompt"><small>다음 문장을 영어로 쓰세요</small><p id="korean" class="korean"></p></div>
    <div id="hint" class="hint hidden"><p>단어를 올바른 순서로 배열해 입력하세요.</p><p id="words" class="words"></p></div>
    <form id="form" autocomplete="off"><label for="answer">영어 문장 입력</label><div class="row"><input id="answer" name="english-sentence-answer" type="text" placeholder="영어 문장을 입력하세요" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><button class="submit" type="submit" aria-label="정답 확인">→</button></div></form>
    <div id="message" class="message"></div><div id="tries" class="tries"></div>
  </div>
  <div id="finish" class="center hidden"><div class="party">🎉</div><h2>6문장을 모두 완성했어요!</h2><p class="note">우리말 문장을 영어로 정확하게 표현했습니다.</p><button class="restart" onclick="restart()">처음부터 다시 하기</button></div>
</section>
</main>
<script>
const questions=[
 {k:"그는 어제 농구를 했다.",a:"He played basketball yesterday."},
 {k:"그는 영어를 좋아한다.",a:"He likes English."},
 {k:"그녀는 농구 동아리에 가입했다.",a:"She joined the basketball club.",alt:["She joined a basketball club."]},
 {k:"그녀는 그녀의 숙제를 끝낼 것이다.",a:"She will finish her homework."},
 {k:"나는 어제 책 동아리에 가입했다.",a:"I joined the book club yesterday.",alt:["I joined a book club yesterday."]},
 {k:"나는 나의 영어 숙제를 끝냈다.",a:"I finished my English homework."}
];
let index=0,mistakes=0,busy=false;const $=id=>document.getElementById(id);
function normalize(s){return s.trim().toLowerCase().replace(/[.!?]+$/,"").replace(/\s+/g," ")}
function shuffled(sentence){const a=sentence.replace(/[.!?]+$/,"").split(" ");for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.join("  ·  ")}
function start(){$("intro").classList.add("hidden");$("game").classList.remove("hidden");show()}
function show(){busy=false;mistakes=0;$("count").textContent=(index+1)+" / "+questions.length;$("fill").style.width=(index/questions.length*100)+"%";$("korean").textContent=questions[index].k;$("answer").value="";$("answer").name="english-sentence-"+index+"-"+Date.now();$("message").textContent="";$("message").className="message";$("tries").textContent="";$("hint").classList.add("hidden");setTimeout(()=>$("answer").focus(),100)}
function message(text,right){$("message").textContent=text;$("message").className="message "+(right?"right":"wrong")}
$("form").addEventListener("submit",e=>{e.preventDefault();if(busy)return;const value=$("answer").value;if(!value.trim())return;const accepted=[questions[index].a,...(questions[index].alt||[])];if(accepted.some(answer=>normalize(value)===normalize(answer))){busy=true;message("정답이에요! 잘 썼어요. ✨",true);setTimeout(()=>{if(index===questions.length-1){$("game").classList.add("hidden");$("finish").classList.remove("hidden")}else{index++;show()}},800)}else{mistakes++;$("answer").value="";message("아쉬워요. 다시 입력해 보세요.",false);$("tries").textContent="오답 "+mistakes+"회";if(mistakes>=3){$("words").textContent=shuffled(questions[index].a);$("hint").classList.remove("hidden")}$("answer").focus()}});
function restart(){index=0;$("finish").classList.add("hidden");$("game").classList.remove("hidden");show()}
</script>
</body></html>
