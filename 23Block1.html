<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>블록 1단계 영어 문장 맞추기</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px;background:radial-gradient(circle at top,#f7fbfa,#eaf2ef 60%,#dfe9e5);font-family:Arial,"Noto Sans KR",sans-serif;color:#26362f}.app{max-width:840px;margin:auto;background:#fff;border:1px solid #d8e5df;border-radius:32px;overflow:hidden;box-shadow:0 18px 50px #43675926}header{padding:28px 38px;background:#315e52;color:#fff}.tag{margin:0;color:#ccece3;font-size:13px;font-weight:900;letter-spacing:.18em}h1{margin:7px 0 0;font-size:35px}header p:last-child{margin:8px 0 0;color:#dcece7}.body{padding:35px 38px}.center{min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.emoji{font-size:58px;width:104px;height:104px;display:grid;place-items:center;border-radius:50%;background:#e7f3ef}h2{margin:20px 0 9px;font-size:29px}.note{max-width:510px;margin:0;color:#687a72;line-height:1.7}button{font:inherit;cursor:pointer}.start,.restart{margin-top:27px;border:0;border-radius:18px;padding:16px 38px;background:#dc7856;color:#fff;font-size:18px;font-weight:900}.restart{background:#315e52}.top{display:flex;align-items:center;gap:16px;margin-bottom:27px}.bar{height:10px;flex:1;overflow:hidden;border-radius:99px;background:#dfebe6}.fill{height:100%;background:#dc7856;transition:width .3s}.count{white-space:nowrap;color:#60756c;font-weight:900}.prompt{border-radius:24px;background:#eef6f3;padding:26px;text-align:center}.prompt small{color:#6c8178;font-weight:800}.korean{margin:11px 0 0;color:#244f43;font-size:25px;font-weight:900;line-height:1.4;word-break:keep-all}.answer-box{min-height:98px;margin-top:20px;border:2px dashed #b5ccc3;border-radius:22px;background:#fbfdfc;padding:15px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.placeholder{color:#8fa199;font-weight:700}.chosen{border:0;border-radius:14px;background:#315e52;color:#fff;padding:13px 18px;font-weight:850;box-shadow:0 4px 9px #315e5238}.period{font-size:22px;font-weight:900}.pool-label{margin:22px 0 10px;color:#5d736a;font-size:13px;font-weight:900}.pool{min-height:120px;border-radius:22px;background:#f8f2ea;padding:19px;display:flex;align-content:center;justify-content:center;gap:11px;flex-wrap:wrap}.block{border:1px solid #ddcfbc;border-radius:15px;background:#fff;color:#34423d;padding:14px 19px;font-weight:850;box-shadow:0 4px 9px #705f4614;transition:.14s}.block:hover{transform:translateY(-2px);border-color:#c29b76}.block:disabled{opacity:0;pointer-events:none}.message{min-height:30px;margin-top:16px;text-align:center;font-weight:900}.right{color:#148763}.wrong{color:#d84e61}.tip{text-align:center;margin-top:8px;color:#87978f;font-size:12px}.hidden{display:none!important}.party{font-size:74px}@media(max-width:600px){body{padding:0}.app{min-height:100vh;border:0;border-radius:0}header{padding:23px}.body{padding:25px 19px}h1{font-size:29px}.korean{font-size:22px}.block,.chosen{padding:12px 14px}.pool{padding:14px}}
</style>
</head>
<body>
<main class="app">
<header><p class="tag">BLOCK LEVEL 1 · PHRASES</p><h1>의미 단위 문장 맞추기</h1><p>의미 단위 블록을 순서대로 클릭해 문장을 완성하세요.</p></header>
<section class="body">
<div id="intro" class="center"><div class="emoji">🧩</div><h2>블록 1단계를 시작해요!</h2><p class="note">우리말 뜻을 읽고 의미 단위로 묶인 영어 블록을 올바른 순서로 클릭하세요. 선택한 블록을 다시 누르면 취소할 수 있어요.</p><button class="start" onclick="start()">학습 시작</button></div>
<div id="game" class="hidden"><div class="top"><div class="bar"><div id="fill" class="fill"></div></div><span id="count" class="count"></span></div><div class="prompt"><small>다음 문장을 영어로 완성하세요</small><p id="korean" class="korean"></p></div><div id="answer" class="answer-box"><span class="placeholder">아래 블록을 순서대로 클릭하세요.</span></div><p class="pool-label">PHRASE BLOCKS</p><div id="pool" class="pool"></div><div id="message" class="message"></div><p class="tip">위 문장 칸의 블록을 누르면 선택을 취소할 수 있습니다.</p></div>
<div id="finish" class="center hidden"><div class="party">🎉</div><h2>10문장을 모두 완성했어요!</h2><p class="note">영어 문장의 의미 단위와 순서를 정확하게 익혔습니다.</p><button class="restart" onclick="restart()">처음부터 다시 하기</button></div>
</section>
</main>
<script>
const questions=[
 {p:["I","joined","Facebook"],k:"나는 페이스북에 가입했다."},
 {p:["She","will send","a DM"],k:"그녀는 DM을 보낼 것이다."},
 {p:["I","am writing","a comment"],k:"나는 댓글을 쓰고 있다."},
 {p:["200 people","are subscribing","to her channel"],k:"200명이 그녀의 채널을 구독하고 있다."},
 {p:["He","followed","me","on Twitter"],k:"그는 트위터에서 나를 팔로우했다."},
 {p:["Many Koreans","joined","TikTok"],k:"많은 한국인들이 틱톡에 가입했다."},
 {p:["Minho","will share","a video"],k:"민호는 영상을 공유할 것이다."},
 {p:["I","am posting","a story","on Instagram"],k:"나는 인스타그램에 스토리를 게시하고 있다."},
 {p:["She","subscribed","to 30 channels"],k:"그녀는 30개의 채널을 구독했다."},
 {p:["This account","has","500 followers"],k:"이 계정은 팔로워가 500명 있다."}
];
let index=0,selected=[],locked=false,blocks=[];const $=id=>document.getElementById(id);
function shuffle(items){let result;do{result=[...items];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}}while(result.length>1&&result.every((x,i)=>x.text===items[i].text));return result}
function start(){$("intro").classList.add("hidden");$("game").classList.remove("hidden");show()}
function show(){locked=false;selected=[];$("count").textContent=(index+1)+" / "+questions.length;$("fill").style.width=(index/questions.length*100)+"%";$("korean").textContent=questions[index].k;$("message").textContent="";$("message").className="message";blocks=shuffle(questions[index].p.map((text,id)=>({text,id})));render()}
function render(){const answer=$("answer"),pool=$("pool");answer.innerHTML="";pool.innerHTML="";if(!selected.length)answer.innerHTML='<span class="placeholder">아래 블록을 순서대로 클릭하세요.</span>';selected.forEach((x,pos)=>{const b=document.createElement("button");b.className="chosen";b.textContent=x.text;b.onclick=()=>remove(pos);answer.appendChild(b)});if(selected.length===blocks.length){const p=document.createElement("span");p.className="period";p.textContent=".";answer.appendChild(p)}blocks.forEach(x=>{const b=document.createElement("button");b.className="block";b.textContent=x.text;b.disabled=selected.some(s=>s.id===x.id);b.onclick=()=>choose(x);pool.appendChild(b)})}
function choose(x){if(locked)return;selected.push(x);render();if(selected.length===blocks.length)check()}
function remove(pos){if(locked)return;selected.splice(pos,1);$("message").textContent="";render()}
function check(){locked=true;const made=selected.map(x=>x.text).join(" ");const answer=questions[index].p.join(" ");if(made===answer){$("message").textContent="정답이에요! 문장을 완성했어요. ✨";$("message").className="message right";setTimeout(()=>{if(index===questions.length-1){$("game").classList.add("hidden");$("finish").classList.remove("hidden")}else{index++;show()}},900)}else{$("message").textContent="순서가 달라요. 다시 풀어 보세요.";$("message").className="message wrong";setTimeout(()=>{selected=[];locked=false;render();$("message").textContent=""},1100)}}
function restart(){index=0;$("finish").classList.add("hidden");$("game").classList.remove("hidden");show()}
</script>
</body></html>
