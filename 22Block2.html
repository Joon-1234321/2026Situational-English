<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>블록 2단계 영어 문장 맞추기</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px;background:radial-gradient(circle at top,#f9fbfc,#ebf0f3 62%,#e2e8eb);font-family:Arial,"Noto Sans KR",sans-serif;color:#28343a}.app{max-width:820px;margin:auto;background:#fff;border:1px solid #dce5e8;border-radius:32px;overflow:hidden;box-shadow:0 18px 50px #52636d24}header{padding:28px 38px;background:#3c5867;color:#fff}.tag{margin:0;color:#cfe8f2;font-size:13px;font-weight:900;letter-spacing:.18em}h1{margin:7px 0 0;font-size:35px}header p:last-child{margin:8px 0 0;color:#dce8ed}.body{padding:35px 38px}.center{min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.emoji{font-size:58px;width:104px;height:104px;display:grid;place-items:center;border-radius:50%;background:#e8f1f5}h2{margin:20px 0 9px;font-size:29px}.note{max-width:490px;margin:0;color:#69777e;line-height:1.7}button{font:inherit;cursor:pointer}.start,.restart{margin-top:27px;border:0;border-radius:18px;padding:16px 38px;background:#dc7957;color:#fff;font-size:18px;font-weight:900}.restart{background:#3c5867}.top{display:flex;align-items:center;gap:16px;margin-bottom:27px}.bar{height:10px;flex:1;overflow:hidden;border-radius:99px;background:#e3e9ec}.fill{height:100%;background:#dc7957;transition:width .3s}.count{white-space:nowrap;color:#64737b;font-weight:900}.prompt{border-radius:24px;background:#f0f5f7;padding:26px;text-align:center}.prompt small{color:#718089;font-weight:800}.korean{margin:11px 0 0;color:#2d4b5b;font-size:25px;font-weight:900;line-height:1.4;word-break:keep-all}.answer-box{min-height:98px;margin-top:20px;border:2px dashed #bccbd2;border-radius:22px;background:#fbfcfd;padding:15px;display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}.placeholder{color:#91a0a7;font-weight:700}.chosen{border:0;border-radius:13px;background:#3c5867;color:#fff;padding:12px 15px;font-weight:850;box-shadow:0 4px 9px #3c586738}.period{font-size:22px;font-weight:900}.pool-label{margin:22px 0 10px;color:#60717a;font-size:13px;font-weight:900}.pool{min-height:125px;border-radius:22px;background:#f7f2eb;padding:19px;display:flex;align-content:center;justify-content:center;gap:10px;flex-wrap:wrap}.block{border:1px solid #dccfbd;border-radius:14px;background:#fff;color:#374149;padding:12px 17px;font-weight:850;box-shadow:0 4px 9px #705f4614;transition:.14s}.block:hover{transform:translateY(-2px);border-color:#c39b77}.block:disabled{opacity:0;pointer-events:none}.message{min-height:30px;margin-top:16px;text-align:center;font-weight:900}.right{color:#168c68}.wrong{color:#da4f62}.tip{text-align:center;margin-top:8px;color:#89969c;font-size:12px}.hidden{display:none!important}.party{font-size:74px}@media(max-width:600px){body{padding:0}.app{min-height:100vh;border:0;border-radius:0}header{padding:23px}.body{padding:25px 19px}h1{font-size:29px}.korean{font-size:22px}.block,.chosen{padding:11px 13px}.pool{padding:14px}}
</style>
</head>
<body>
<main class="app">
<header><p class="tag">BLOCK LEVEL 2 · WORDS</p><h1>단어 하나씩 문장 맞추기</h1><p>모든 단어를 순서대로 클릭해 문장을 완성하세요.</p></header>
<section class="body">
<div id="intro" class="center"><div class="emoji">🔤</div><h2>블록 2단계를 시작해요!</h2><p class="note">우리말 뜻을 읽고 섞인 영어 단어를 하나씩 올바른 순서로 클릭하세요. 선택한 단어를 다시 누르면 취소할 수 있어요.</p><button class="start" onclick="start()">학습 시작</button></div>
<div id="game" class="hidden"><div class="top"><div class="bar"><div id="fill" class="fill"></div></div><span id="count" class="count"></span></div><div class="prompt"><small>다음 문장을 영어로 완성하세요</small><p id="korean" class="korean"></p></div><div id="answer" class="answer-box"><span class="placeholder">아래 단어를 순서대로 클릭하세요.</span></div><p class="pool-label">WORD BLOCKS</p><div id="pool" class="pool"></div><div id="message" class="message"></div><p class="tip">위 문장 칸의 단어를 누르면 선택을 취소할 수 있습니다.</p></div>
<div id="finish" class="center hidden"><div class="party">🎉</div><h2>10문장을 모두 완성했어요!</h2><p class="note">모든 단어의 순서를 정확하게 익혔습니다.</p><button class="restart" onclick="restart()">처음부터 다시 하기</button></div>
</section>
</main>
<script>
const questions=[
 {w:["Mina","is","a","famous","YouTuber"],k:"미나는 유명한 유튜버이다."},
 {w:["This","is","a","good","place","for","pictures"],k:"이곳은 사진을 찍기에 좋은 장소이다."},
 {w:["His","videos","are","not","funny"],k:"그의 영상들은 재미있지 않다."},
 {w:["She","looks","cool","in","her","Instagram","photos"],k:"그녀는 인스타그램 사진에서 멋져 보인다."},
 {w:["They","are","getting","popular"],k:"그들은 인기를 얻고 있다."},
 {w:["He","was","a","famous","YouTuber"],k:"그는 유명한 유튜버였다."},
 {w:["The","song","is","popular","on","TikTok"],k:"그 노래는 틱톡에서 인기가 있다."},
 {w:["His","videos","are","always","funny"],k:"그의 영상들은 항상 재미있다."},
 {w:["Sumin","looks","good","in","the","video"],k:"수민은 영상에서 좋아 보인다."},
 {w:["Tom's","vlogs","are","getting","boring"],k:"톰의 브이로그는 점점 지루해지고 있다."}
];
let index=0,selected=[],locked=false,blocks=[];const $=id=>document.getElementById(id);
function shuffle(a){const b=[...a];do{for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}}while(b.length>1&&b.every((x,i)=>x.text===a[i].text));return b}
function start(){$("intro").classList.add("hidden");$("game").classList.remove("hidden");show()}
function show(){locked=false;selected=[];$("count").textContent=(index+1)+" / "+questions.length;$("fill").style.width=(index/questions.length*100)+"%";$("korean").textContent=questions[index].k;$("message").textContent="";$("message").className="message";blocks=shuffle(questions[index].w.map((text,id)=>({text,id})));render()}
function render(){const answer=$("answer"),pool=$("pool");answer.innerHTML="";pool.innerHTML="";if(!selected.length)answer.innerHTML='<span class="placeholder">아래 단어를 순서대로 클릭하세요.</span>';selected.forEach((x,pos)=>{const b=document.createElement("button");b.className="chosen";b.textContent=x.text;b.onclick=()=>remove(pos);answer.appendChild(b)});if(selected.length===blocks.length){const p=document.createElement("span");p.className="period";p.textContent=".";answer.appendChild(p)}blocks.forEach(x=>{const b=document.createElement("button");b.className="block";b.textContent=x.text;b.disabled=selected.some(s=>s.id===x.id);b.onclick=()=>choose(x);pool.appendChild(b)})}
function choose(x){if(locked)return;selected.push(x);render();if(selected.length===blocks.length)check()}
function remove(pos){if(locked)return;selected.splice(pos,1);$("message").textContent="";render()}
function check(){locked=true;const made=selected.map(x=>x.text).join(" ");const answer=questions[index].w.join(" ");if(made===answer){$("message").textContent="정답이에요! 문장을 완성했어요. ✨";$("message").className="message right";setTimeout(()=>{if(index===questions.length-1){$("game").classList.add("hidden");$("finish").classList.remove("hidden")}else{index++;show()}},900)}else{$("message").textContent="순서가 달라요. 다시 풀어 보세요.";$("message").className="message wrong";setTimeout(()=>{selected=[];locked=false;render();$("message").textContent=""},1100)}}
function restart(){index=0;$("finish").classList.add("hidden");$("game").classList.remove("hidden");show()}
</script>
</body></html>
