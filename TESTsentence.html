<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>영어 문장 만들기 - 단어 클릭</title>
<style>
  :root{
    --bg:#f6f8fc;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --line:#dbe2ea;
    --primary:#3156d3;
    --primary-dark:#2443aa;
    --soft:#eef2ff;
    --ok:#16803c;
    --ok-bg:#ecfdf3;
    --bad:#c93434;
    --bad-bg:#fff1f1;
  }
  *{box-sizing:border-box}
  html,body{margin:0; min-height:100%; font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",Arial,sans-serif; color:var(--text); background:var(--bg)}
  body{min-height:100vh; display:flex; justify-content:center; padding:18px}
  .app{width:min(980px,100%); display:flex; flex-direction:column; gap:14px}
  .topbar{display:flex; gap:12px; align-items:center}
  .progress-wrap{flex:1; height:12px; background:#e7eaf0; border-radius:999px; overflow:hidden}
  .progress{height:100%; width:0; background:var(--primary); transition:width .3s ease}
  .counter{font-weight:800; min-width:68px; text-align:right; font-size:17px}
  .card{background:var(--card); border:1px solid #e5e9f0; border-radius:22px; box-shadow:0 8px 28px rgba(31,41,55,.07); padding:clamp(20px,4vw,38px)}
  .label{font-size:14px; font-weight:800; color:var(--primary); letter-spacing:.02em; margin-bottom:8px}
  .korean{font-size:clamp(22px,4vw,34px); font-weight:800; line-height:1.45; word-break:keep-all; margin-bottom:28px}
  .section-title{font-size:15px; font-weight:800; color:var(--muted); margin-bottom:10px}
  .answer-zone,.word-bank{min-height:92px; border-radius:16px; padding:14px; display:flex; flex-wrap:wrap; align-content:flex-start; gap:10px}
  .answer-zone{border:2px dashed #cbd5e1; background:#fafcff; margin-bottom:24px; position:relative}
  .answer-zone.empty::after{content:"아래 단어를 순서대로 클릭하세요"; color:#9aa4b2; font-weight:700; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); white-space:nowrap; font-size:clamp(13px,2.3vw,17px)}
  .word-bank{border:1px solid var(--line); background:#f8fafc}
  .word{appearance:none; border:1px solid #bfc9d8; border-radius:12px; background:white; color:#172033; padding:12px 16px; min-height:48px; font-size:clamp(18px,3vw,24px); font-weight:800; cursor:pointer; box-shadow:0 2px 0 rgba(0,0,0,.05); transition:transform .08s ease, background .15s ease, border-color .15s ease}
  .word:hover{border-color:var(--primary); background:var(--soft)}
  .word:active{transform:translateY(1px) scale(.98)}
  .answer-zone .word{background:var(--soft); border-color:#a8b7f7; color:#233e9f}
  .punct{font-size:clamp(20px,3vw,25px); font-weight:900; align-self:center; margin-left:-5px}
  .feedback{min-height:32px; margin-top:16px; font-size:18px; font-weight:800; text-align:center}
  .feedback.ok{color:var(--ok)}
  .feedback.bad{color:var(--bad)}
  .controls{display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin-top:12px}
  .control{border:0; border-radius:12px; padding:11px 16px; font-size:15px; font-weight:800; cursor:pointer; background:#e9edf4; color:#344054}
  .control:hover{background:#dde3ec}
  .control.primary{background:var(--primary); color:white}
  .control.primary:hover{background:var(--primary-dark)}
  .result{text-align:center; padding:30px 10px}
  .result h1{font-size:clamp(30px,5vw,48px); margin:0 0 12px}
  .result p{font-size:20px; color:var(--muted); margin:0 0 24px}
  .hidden{display:none!important}
  .shake{animation:shake .28s linear}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  @media(max-width:600px){
    body{padding:10px}
    .card{border-radius:17px; padding:20px 15px}
    .answer-zone,.word-bank{padding:11px; gap:8px; min-height:82px}
    .word{padding:10px 13px; min-height:44px}
  }
</style>
</head>
<body>
<main class="app">
  <div class="topbar" aria-label="진행 상황">
    <div class="progress-wrap"><div id="progress" class="progress"></div></div>
    <div id="counter" class="counter">1 / 30</div>
  </div>

  <section id="quizCard" class="card">
    <div class="label">우리말</div>
    <div id="korean" class="korean"></div>

    <div class="section-title">내가 만든 문장</div>
    <div id="answerZone" class="answer-zone empty" aria-label="선택한 단어"></div>

    <div class="section-title">단어를 순서대로 클릭하세요</div>
    <div id="wordBank" class="word-bank" aria-label="섞인 단어"></div>

    <div id="feedback" class="feedback" aria-live="polite"></div>
    <div class="controls">
      <button id="undoBtn" class="control" type="button">↩ 한 단어 되돌리기</button>
      <button id="resetBtn" class="control" type="button">처음부터</button>
      <button id="shuffleBtn" class="control" type="button">🔀 다시 섞기</button>
    </div>
  </section>

  <section id="resultCard" class="card hidden">
    <div class="result">
      <h1>🎉 모두 완성!</h1>
      <p>30개의 문장을 모두 정확하게 만들었습니다.</p>
      <button id="restartBtn" class="control primary" type="button">처음부터 다시 하기</button>
    </div>
  </section>
</main>

<script>
const items = [
  {en:"I like the lunch menu today.", ko:"나는 오늘 점심 메뉴가 좋다."},
  {en:"She played soccer yesterday.", ko:"그녀는 어제 축구를 했어."},
  {en:"We finished our English homework.", ko:"우리는 우리의 영어숙제를 했어."},
  {en:"I will do my homework after school.", ko:"나는 방과후에 숙제를 할거야."},
  {en:"He joined the movie club.", ko:"그는 영화 클럽에 가입했어."},
  {en:"I like the school lunch.", ko:"나는 학교 점심이 좋아."},
  {en:"She will play basketball today.", ko:"그녀는 오늘 농구를 할거야."},
  {en:"She will finish her homework.", ko:"그녀는 그녀의 숙제를 끝낼거야."},
  {en:"He did his homework yesterday.", ko:"그는 어제 그의 숙제를 했어."},
  {en:"I joined the book club.", ko:"나는 책 동아리에 가입했어."},
  {en:"She is always on Facebook.", ko:"그녀는 항상 페이스북에 있어."},
  {en:"This Tiktoker is from Korea.", ko:"이 틱토커는 한국출신이야."},
  {en:"The dog is sleeping in her video.", ko:"그 개는 그녀의 영상에서 자고 있다."},
  {en:"We chatted on Tiktok.", ko:"우리는 틱톡에서 이야기 했어."},
  {en:"There are many travel vlogs.", ko:"많은 여행 브로그가 있어."},
  {en:"She is not on Instagram.", ko:"그녀는 인스타그램에 없어."},
  {en:"This YouTuber is not from Jeju.", ko:"이 유튜버는 제주 출신이 아니야."},
  {en:"He tweeted with his friends.", ko:"그는 친구들고 트윗을 했어."},
  {en:"The baby cried in the video.", ko:"그 아기는 영상에서 울었어."},
  {en:"There are not many school vlogs.", ko:"학교 브이로그는 많지가 않아."},
  {en:"Mina is a famous YouTuber.", ko:"미나는 유명한 유튜버야."},
  {en:"This is a good place for pictures.", ko:"이곳은 사진찍기에 좋은 장소야."},
  {en:"His videos are not funny.", ko:"그의 영상들은 재미가 없어."},
  {en:"She looks cool in her Instagram photos.", ko:"그녀는 그녀의 인스타그램 사진에서 멋져 보여."},
  {en:"They are getting popular.", ko:"그들안 인기가 많아지고 있어."},
  {en:"He was a famous YouTuber.", ko:"그는 유명한 유튜버였어."},
  {en:"The song is popular on TikTok.", ko:"그 노래는 틱톡에서 인기가 있어."},
  {en:"His videos are always funny.", ko:"그의 영상들은 항상 재미있어."},
  {en:"Sumin looks good in the video.", ko:"수민은 그 영상에서 좋아 보여."},
  {en:"Tom's vlogs are getting boring.", ko:"Tom의 브이로그는 지루해 지고 있어."}
];

let current = 0;
let answer = [];
let bank = [];
let locked = false;

const $ = id => document.getElementById(id);
const korean = $("korean");
const answerZone = $("answerZone");
const wordBank = $("wordBank");
const feedback = $("feedback");
const counter = $("counter");
const progress = $("progress");
const quizCard = $("quizCard");
const resultCard = $("resultCard");

function parseSentence(sentence){
  const normalized = sentence.trim().replace(/\s+/g," ");
  const m = normalized.match(/([.!?])$/);
  const punctuation = m ? m[1] : "";
  const body = punctuation ? normalized.slice(0,-1) : normalized;
  const words = body.split(" ");
  return {words, punctuation};
}

function shuffleArray(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function shuffledNotOriginal(words){
  if(words.length < 2) return [...words];
  const original = words.join("\u0001");
  let shuffled;
  let tries = 0;
  do{
    shuffled = shuffleArray(words.map((text, idx)=>({text, uid:`${current}-${Date.now()}-${idx}-${Math.random()}`})));
    tries++;
  }while(shuffled.map(x=>x.text).join("\u0001")===original && tries<12);
  return shuffled;
}

function loadItem(){
  locked = false;
  answer = [];
  feedback.textContent = "";
  feedback.className = "feedback";
  const item = items[current];
  const parsed = parseSentence(item.en);
  bank = shuffledNotOriginal(parsed.words);
  korean.textContent = item.ko;
  counter.textContent = `${current+1} / ${items.length}`;
  progress.style.width = `${(current/items.length)*100}%`;
  render();
}

function render(){
  const { punctuation } = parseSentence(items[current].en);
  answerZone.innerHTML = "";
  wordBank.innerHTML = "";
  answerZone.classList.toggle("empty", answer.length===0);

  answer.forEach((token, index)=>{
    const btn = makeWordButton(token.text, ()=>removeFromAnswer(index));
    btn.title = "클릭하면 이 단어를 다시 아래로 보냅니다.";
    answerZone.appendChild(btn);
  });

  if(answer.length === parseSentence(items[current].en).words.length && punctuation){
    const p = document.createElement("span");
    p.className = "punct";
    p.textContent = punctuation;
    answerZone.appendChild(p);
  }

  bank.forEach(token=>{
    wordBank.appendChild(makeWordButton(token.text, ()=>moveToAnswer(token.uid)));
  });
}

function makeWordButton(text, handler){
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "word";
  btn.textContent = text;
  btn.addEventListener("click", handler);
  return btn;
}

function moveToAnswer(uid){
  if(locked) return;
  const idx = bank.findIndex(x=>x.uid===uid);
  if(idx<0) return;
  answer.push(bank[idx]);
  bank.splice(idx,1);
  render();
  if(bank.length===0) checkAnswer();
}

function removeFromAnswer(index){
  if(locked) return;
  const [token] = answer.splice(index,1);
  bank.push(token);
  render();
  clearFeedback();
}

function undo(){
  if(locked || answer.length===0) return;
  bank.push(answer.pop());
  render();
  clearFeedback();
}

function resetCurrent(reshuffle=false){
  if(locked) return;
  const words = parseSentence(items[current].en).words;
  answer = [];
  bank = reshuffle ? shuffledNotOriginal(words) : bank.concat(answer);
  if(!reshuffle){
    bank = shuffledNotOriginal(words);
  }
  clearFeedback();
  render();
}

function clearFeedback(){
  feedback.textContent = "";
  feedback.className = "feedback";
}

function checkAnswer(){
  const correct = parseSentence(items[current].en).words;
  const chosen = answer.map(x=>x.text);
  const isCorrect = chosen.length===correct.length && chosen.every((w,i)=>w===correct[i]);

  if(isCorrect){
    locked = true;
    feedback.textContent = "✓ 정답! 다음 문장으로 넘어갑니다.";
    feedback.className = "feedback ok";
    progress.style.width = `${((current+1)/items.length)*100}%`;
    setTimeout(()=>{
      current++;
      if(current >= items.length){ showResult(); }
      else loadItem();
    }, 900);
  }else{
    locked = true;
    feedback.textContent = "순서가 달라요. 다시 해 보세요!";
    feedback.className = "feedback bad";
    answerZone.classList.add("shake");
    setTimeout(()=>{
      answerZone.classList.remove("shake");
      const words = parseSentence(items[current].en).words;
      answer = [];
      bank = shuffledNotOriginal(words);
      locked = false;
      render();
    }, 850);
  }
}

function showResult(){
  quizCard.classList.add("hidden");
  resultCard.classList.remove("hidden");
  counter.textContent = `${items.length} / ${items.length}`;
  progress.style.width = "100%";
}

$("undoBtn").addEventListener("click", undo);
$("resetBtn").addEventListener("click", ()=>resetCurrent(false));
$("shuffleBtn").addEventListener("click", ()=>resetCurrent(true));
$("restartBtn").addEventListener("click", ()=>{
  current=0;
  quizCard.classList.remove("hidden");
  resultCard.classList.add("hidden");
  loadItem();
});

loadItem();
</script>
</body>
</html>
