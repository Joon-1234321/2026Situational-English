<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>블록으로 영어 문장 변환하기</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px;background:radial-gradient(circle at top,#fbfaf6,#efeee7 62%,#e7e4dc);font-family:Arial,"Noto Sans KR",sans-serif;color:#30352e}
.app{max-width:820px;margin:auto;background:#fff;border:1px solid #e3e0d7;border-radius:32px;overflow:hidden;box-shadow:0 18px 50px #625f5526}header{padding:28px 38px;background:#5b5d48;color:#fff}.tag{margin:0;color:#e8ebcb;font-size:13px;font-weight:900;letter-spacing:.18em}h1{margin:7px 0 0;font-size:35px}header p:last-child{margin:8px 0 0;color:#e8e9df}
.body{padding:34px 38px}.center{min-height:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.emoji{font-size:58px;width:104px;height:104px;display:grid;place-items:center;border-radius:50%;background:#f2f1e5}h2{margin:20px 0 9px;font-size:29px}.note{max-width:500px;margin:0;color:#74766d;line-height:1.7}
button{font:inherit;cursor:pointer}.start,.restart{margin-top:27px;border:0;border-radius:18px;padding:16px 38px;background:#d17954;color:#fff;font-size:18px;font-weight:900}.restart{background:#5b5d48}
.top{display:flex;align-items:center;gap:16px;margin-bottom:25px}.bar{height:10px;flex:1;overflow:hidden;border-radius:99px;background:#e8e7df}.fill{height:100%;background:#d17954;transition:width .3s}.count{white-space:nowrap;color:#6f7168;font-weight:900}
.source{border-radius:22px;background:#f4f4ef;padding:19px;text-align:center}.source small,.instruction small{color:#7c7e74;font-weight:850}.english{margin:8px 0 0;color:#4d4f41;font-size:23px;font-weight:900;line-height:1.4}.instruction{margin-top:12px;border:1px solid #ead9b8;border-radius:19px;background:#fff9ec;padding:15px;text-align:center}.korean{margin:7px 0 0;color:#895728;font-size:18px;font-weight:900;line-height:1.45;word-break:keep-all}
.answer-box{min-height:94px;margin-top:19px;border:2px dashed #c7c8b8;border-radius:21px;background:#fdfdfb;padding:15px;display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}.placeholder{color:#999b91;font-weight:750}.chosen{border:0;border-radius:13px;background:#5b5d48;color:#fff;padding:12px 15px;font-weight:850;box-shadow:0 4px 9px #5b5d4838}.period{font-size:22px;font-weight:900}
.pool-label{margin:20px 0 9px;color:#6d6f65;font-size:13px;font-weight:900}.pool{min-height:115px;border-radius:21px;background:#f7f2ea;padding:17px;display:flex;align-content:center;justify-content:center;gap:10px;flex-wrap:wrap}.block{border:1px solid #ddcdbb;border-radius:14px;background:#fff;color:#3f433c;padding:12px 17px;font-weight:850;box-shadow:0 4px 9px #705f4614;transition:.14s}.block:hover{transform:translateY(-2px);border-color:#c49975}.block:disabled{opacity:0;pointer-events:none}
.message{min-height:30px;margin-top:15px;text-align:center;font-weight:900}.right{color:#198463}.wrong{color:#d34e60}.tip{text-align:center;margin-top:7px;color:#92948c;font-size:12px}.hidden{display:none!important}.party{font-size:74px}
@media(max-width:600px){body{padding:0}.app{min-height:100vh;border:0;border-radius:0}header{padding:23px}.body{padding:24px 18px}h1{font-size:29px}.english{font-size:20px}.korean{font-size:17px}.block,.chosen{padding:11px 13px}.pool{padding:14px}}
</style>
</head>
<body>
<main class="app">
<header><p class="tag">CLICK &amp; TRANSFORM</p><h1>블록으로 문장 변환하기</h1><p>지시에 맞게 바뀐 문장을 블록으로 완성하세요.</p></header>
<section class="body">
  <div id="intro" class="center"><div class="emoji">🔄</div><h2>문장을 바꿔 볼까요?</h2><p class="note">원래 문장과 변환 지시를 읽은 뒤, 섞인 단어 블록을 올바른 순서로 클릭하세요. 선택한 블록을 다시 누르면 취소할 수 있어요.</p><button class="start" onclick="start()">학습 시작</button></div>
  <div id="game" class="hidden">
    <div class="top"><div class="bar"><div id="fill" class="fill"></div></div><span id="count" class="count"></span></div>
    <div class="source"><small>원래 문장</small><p id="source" class="english"></p></div>
    <div class="instruction"><small>변환 지시</small><p id="instruction" class="korean"></p></div>
    <div id="answer" class="answer-box"><span class="placeholder">아래 단어를 순서대로 클릭하세요.</span></div>
    <p class="pool-label">WORD BLOCKS</p><div id="pool" class="pool"></div>
    <div id="message" class="message"></div><p class="tip">위 문장 칸의 단어를 누르면 선택을 취소할 수 있습니다.</p>
  </div>
  <div id="finish" class="center hidden"><div class="party">🎉</div><h2>10문장을 모두 변환했어요!</h2><p class="note">주어, 시제, 시간 표현을 정확하게 바꾸었습니다.</p><button class="restart" onclick="restart()">처음부터 다시 하기</button></div>
</section>
</main>
<script>
const questions=[
 {s:"She is always on Facebook.",i:"Facebook을 Instagram으로 바꾸세요.",answers:["She is always on Instagram"]},
 {s:"This TikToker is from Korea.",i:"제주 출신이 아니라고 바꾸세요.",answers:["This TikToker is not from Jeju"]},
 {s:"The dog is sleeping in her video.",i:"dog을 baby로 바꾸세요.",answers:["The baby is sleeping in her video"]},
 {s:"We chatted on TikTok.",i:"앞으로 채팅할 것이라고 바꾸세요.",answers:["We will chat on TikTok"]},
 {s:"There are many travel vlogs.",i:"많지 않다는 부정문으로 바꾸세요.",answers:["There are not many travel vlogs"]},
 {s:"She is not on Instagram.",i:"Facebook을 한다는 긍정문으로 바꾸세요.",answers:["She is on Facebook"]},
 {s:"This YouTuber is not from Jeju.",i:"한국 출신이라는 긍정문으로 바꾸세요.",answers:["This YouTuber is from Korea"]},
 {s:"He tweeted with his friends.",i:"앞으로 트윗할 것이라고 바꾸세요.",answers:["He will tweet with his friends"]},
 {s:"The baby cried in the video.",i:"지금 울고 있다고 바꾸세요.",answers:["The baby is crying in the video"]},
 {s:"There are not many school vlogs.",i:"많다는 긍정문으로 바꾸세요.",answers:["There are many school vlogs"]}
];
let index=0,selected=[],locked=false,blocks=[];const $=id=>document.getElementById(id);
function shuffle(items){let b;do{b=[...items];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}}while(b.length>1&&b.every((x,i)=>x.text===items[i].text));return b}
function start(){$("intro").classList.add("hidden");$("game").classList.remove("hidden");show()}
function show(){locked=false;selected=[];const q=questions[index];$("count").textContent=(index+1)+" / "+questions.length;$("fill").style.width=(index/questions.length*100)+"%";$("source").textContent=q.s;$("instruction").textContent=q.i;$("message").textContent="";$("message").className="message";const words=q.answers[0].split(" ").concat(q.extra||[]);blocks=shuffle(words.map((text,id)=>({text,id})));render()}
function render(){const answer=$("answer"),pool=$("pool");answer.innerHTML="";pool.innerHTML="";if(!selected.length)answer.innerHTML='<span class="placeholder">아래 단어를 순서대로 클릭하세요.</span>';selected.forEach((x,pos)=>{const b=document.createElement("button");b.className="chosen";b.textContent=x.text;b.onclick=()=>remove(pos);answer.appendChild(b)});if(selected.length===questions[index].answers[0].split(" ").length){const p=document.createElement("span");p.className="period";p.textContent=".";answer.appendChild(p)}blocks.forEach(x=>{const b=document.createElement("button");b.className="block";b.textContent=x.text;b.disabled=selected.some(s=>s.id===x.id);b.onclick=()=>choose(x);pool.appendChild(b)})}
function choose(x){if(locked)return;selected.push(x);render();if(selected.length===questions[index].answers[0].split(" ").length)check()}
function remove(pos){if(locked)return;selected.splice(pos,1);$("message").textContent="";render()}
function check(){locked=true;const made=selected.map(x=>x.text).join(" ");if(questions[index].answers.includes(made)){$("message").textContent="정답이에요! 문장을 잘 바꿨어요. ✨";$("message").className="message right";setTimeout(()=>{if(index===questions.length-1){$("game").classList.add("hidden");$("finish").classList.remove("hidden")}else{index++;show()}},900)}else{$("message").textContent="순서 또는 바꾼 표현을 다시 확인하세요.";$("message").className="message wrong";setTimeout(()=>{selected=[];locked=false;render();$("message").textContent=""},1150)}}
function restart(){index=0;$("finish").classList.add("hidden");$("game").classList.remove("hidden");show()}
</script>
</body></html>
