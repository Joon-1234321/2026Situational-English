<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>듣고 영어 철자 쓰기</title>
<style>
:root{--ink:#26364a;--blue:#4b7088;--pale:#e8f0f5;--cream:#f7f6f1;--red:#a4514c;--gold:#b38d29}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,"Malgun Gothic",sans-serif}.wrap{width:min(880px,100%);margin:auto;padding:42px 18px 70px}header{margin-bottom:22px}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.18em}h1{font-size:30px;margin:7px 0 5px;letter-spacing:-.04em}header p{margin:0;color:#7b8783}.card{background:#fff;border:1px solid #e3e8e4;border-radius:28px;padding:30px 36px 32px;box-shadow:0 18px 50px #4d5b5212;text-align:center}.progress{display:flex;justify-content:space-between;color:#718096;font-size:14px;font-weight:700}.progress strong{color:var(--blue)}.track{height:6px;background:#edf0ee;border-radius:20px;margin:12px 0 32px;overflow:hidden}.track i{display:block;height:100%;background:var(--blue);border-radius:20px}.listen{padding:10px 0 27px}.speaker{width:104px;height:104px;border:0;border-radius:50%;background:var(--pale);color:var(--blue);font-size:44px;cursor:pointer;box-shadow:0 8px 20px #45687d20}.speaker:active{transform:scale(.96)}.listen h2{font-size:21px;margin:17px 0 5px}.listen p{font-size:13px;color:#8d9894;margin:0}form{max-width:680px;margin:auto}.inputbox{position:relative}input{width:100%;height:64px;border:2px solid #cbd7d3;border-radius:16px;padding:0 58px 0 18px;font-size:22px;color:var(--ink);outline:none;background:#fafcfb}input:focus{border-color:#7898ad;box-shadow:0 0 0 4px #dce8ef88}.submit{position:absolute;right:9px;top:9px;width:46px;height:46px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:23px;font-weight:bold}.guide{font-size:13px;color:#97a19e;margin:11px 0 0}.feedback{min-height:48px;display:flex;justify-content:center;align-items:center;gap:9px;font-weight:700;color:#71807b}.feedback.error{color:var(--red)}.feedback.success{color:#477a68}.feedback b{width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:#edf3f0}.hint{margin:10px auto 4px;padding:17px;border-radius:17px;background:#f6f1e3;border:1px solid #eadfbf;max-width:680px}.meaning{font-size:17px;font-weight:800;color:#745f26;margin-bottom:12px}.letters{display:flex;justify-content:center;flex-wrap:wrap;gap:7px}.letters span{min-width:35px;background:#fff;border:1px solid #dfd4b7;border-radius:10px;padding:8px 9px;font-size:18px;font-weight:800}.letters .space{border:0;background:transparent;min-width:18px}.attempts{font-size:13px;color:#9aa29f;margin-top:18px}.start{padding:56px 10px}.startIcon{font-size:58px}.primary,.restart{border:0;background:var(--blue);color:#fff;border-radius:14px;padding:14px 25px;font-weight:800;font-size:16px;cursor:pointer}.finish{padding:50px 12px}.star{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:#f5e9bd;color:var(--gold);font-size:44px}.finish small{color:var(--gold);font-weight:800;letter-spacing:.18em}.finish h2{font-size:30px;margin:9px 0}.finish p{color:#718096}@media(max-width:650px){.wrap{padding:24px 13px}.card{padding:23px 16px;border-radius:22px}h1{font-size:25px}input{height:60px;font-size:19px}.submit{top:7px}.speaker{width:92px;height:92px}}
</style></head><body><main class="wrap"><header><span class="eyebrow">LISTEN & SPELL</span><h1>듣고 영어 철자 쓰기</h1><p>단어를 잘 듣고 영어 철자를 입력하세요.</p></header><section class="card" id="app"></section></main>
<script>
const questions=[
 {ko:"담임 선생님",answer:"homeroom teacher"},{ko:"학급 친구",answer:"classmate"},{ko:"가장 좋아하는",answer:"favorite"},{ko:"과목",answer:"subject"},{ko:"영어",answer:"English"},{ko:"수학",answer:"math"},{ko:"교실",answer:"classroom"},{ko:"깨끗한",answer:"clean"},{ko:"미술",answer:"art"},{ko:"작은",answer:"small"}
];
let index=0,tries=0,locked=false,started=false;const app=document.querySelector("#app");
function clean(s){return s.trim().toLowerCase().replace(/\s+/g," ")}
function voice(){const vs=speechSynthesis.getVoices();return vs.find(v=>/^en-(US|GB)/.test(v.lang))||vs.find(v=>v.lang.startsWith("en"))}
function speak(){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const text=questions[index].answer;const sound=new SpeechSynthesisUtterance(text+". "+text+".");sound.lang="en-US";sound.rate=.74;sound.pitch=1;const v=voice();if(v)sound.voice=v;speechSynthesis.speak(sound)}
function scrambled(){const words=questions[index].answer.toLowerCase().split(" ");return words.flatMap((word,wi)=>{let a=word.split("");for(let i=a.length-1;i>0;i--){const j=(i*5+index*3+tries+wi)%(i+1);[a[i],a[j]]=[a[j],a[i]]}if(a.join("")===word&&a.length>1)[a[0],a[1]]=[a[1],a[0]];return wi?[{space:true},...a]:a})}
function start(){started=true;render();setTimeout(speak,150)}
function render(message="스피커를 눌러 다시 들을 수 있어요.",state=""){if(!started){app.innerHTML='<div class="start"><div class="startIcon">🎧</div><h2>소리를 켜고 준비하세요</h2><p>시작하면 영어 단어를 두 번 읽어 줍니다.</p><button class="primary" id="startBtn">학습 시작</button></div>';document.querySelector("#startBtn").onclick=start;return}
 const hint=tries>=3?'<div class="hint"><div class="meaning">우리말 뜻: '+questions[index].ko+'</div><div class="letters">'+scrambled().map(x=>x.space?'<span class="space">＋</span>':'<span>'+x+'</span>').join("")+'</div></div>':"";
 app.innerHTML='<div class="progress"><span>듣고 스펠링</span><strong>'+(index+1)+' / '+questions.length+'</strong></div><div class="track"><i style="width:'+((index+1)/questions.length*100)+'%"></i></div><div class="listen"><button class="speaker" id="speaker" aria-label="영어 단어 다시 듣기">🔊</button><h2>영어 단어를 듣고 입력하세요</h2><p>버튼을 누르면 단어를 두 번 읽어 줍니다.</p></div><form id="answerForm" autocomplete="off"><div class="inputbox"><input id="answer" type="text" name="listen_'+Date.now()+'" aria-label="영어 철자 입력" placeholder="들은 단어를 입력하세요" autocomplete="new-password" autocorrect="off" autocapitalize="none" spellcheck="false"><button class="submit" type="submit" aria-label="정답 확인">↵</button></div><p class="guide">대소문자는 채점에 영향을 주지 않아요.</p></form><div class="feedback '+state+'"><b>'+(state==="error"?"↻":state==="success"?"✓":"♪")+'</b>'+message+'</div>'+hint+'<div class="attempts">현재 문제 오답 횟수: '+tries+'회</div>';
 document.querySelector("#speaker").onclick=speak;const input=document.querySelector("#answer");input.readOnly=true;setTimeout(()=>{input.readOnly=false;input.focus()},60);document.querySelector("#answerForm").onsubmit=check}
function check(e){e.preventDefault();if(locked)return;const value=clean(document.querySelector("#answer").value);if(!value)return;if(value===clean(questions[index].answer)){locked=true;speechSynthesis.cancel();render("정답이에요! 다음 문제로 이동합니다. 🎉","success");setTimeout(()=>{if(index===questions.length-1)finish();else{index++;tries=0;locked=false;render();setTimeout(speak,180)}},900)}else{tries++;render(tries>=3?"우리말 뜻과 섞인 철자를 참고해 다시 입력하세요.":"다시 잘 듣고 철자를 입력해 보세요.","error")}}
function finish(){speechSynthesis.cancel();app.innerHTML='<div class="finish"><div class="star">★</div><small>ALL CLEAR</small><h2>10문제를 모두 완성했어요!</h2><p>듣기와 스펠링 연습을 끝까지 잘했어요.</p><button class="restart">처음부터 다시 하기</button></div>';document.querySelector(".restart").onclick=()=>{index=0;tries=0;locked=false;started=false;render()}}render();
</script></body></html>
