<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>영어 의미 단위 블록 맞추기</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px;background:radial-gradient(circle at top,#fafbf8,#edf1e8 62%,#e6eadf);font-family:Arial,"Noto Sans KR",sans-serif;color:#29322b}
.app{max-width:820px;margin:auto;background:#fff;border:1px solid #e1e5da;border-radius:32px;overflow:hidden;box-shadow:0 18px 50px #5e695326}header{padding:27px 38px;background:#59684a;color:#fff}.tag{margin:0;color:#e0ebcf;font-size:13px;font-weight:900;letter-spacing:.18em}h1{margin:7px 0 0;font-size:35px}header p:last-child{margin:8px 0 0;color:#e8eddf}
.body{padding:34px 38px}.center{min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.emoji{font-size:58px;width:104px;height:104px;display:grid;place-items:center;border-radius:50%;background:#eff3e8}h2{margin:20px 0 9px;font-size:29px}.note{max-width:480px;margin:0;color:#6f786a;line-height:1.7}
button{font:inherit;cursor:pointer}.start,.restart{margin-top:27px;border:0;border-radius:18px;padding:16px 38px;background:#d67c58;color:#fff;font-size:18px;font-weight:900}.restart{background:#59684a}
.top{display:flex;align-items:center;gap:16px;margin-bottom:27px}.bar{height:10px;flex:1;overflow:hidden;border-radius:99px;background:#e5eadf}.fill{height:100%;background:#d67c58;transition:width .3s}.count{white-space:nowrap;color:#6c7567;font-weight:900}
.prompt{border-radius:24px;background:#f3f6ee;padding:25px;text-align:center}.prompt small{color:#77816f;font-weight:800}.korean{margin:11px 0 0;color:#435238;font-size:25px;font-weight:900;line-height:1.4;word-break:keep-all}
.answer-box{min-height:94px;margin-top:20px;border:2px dashed #c4ceb7;border-radius:22px;background:#fcfdfb;padding:15px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.placeholder{color:#98a08f;font-weight:700}.chosen{border:0;border-radius:14px;background:#59684a;color:#fff;padding:13px 18px;font-weight:850;box-shadow:0 4px 9px #59684a38}.period{font-size:22px;font-weight:900}
.pool-label{margin:22px 0 10px;color:#6b7563;font-size:13px;font-weight:900}.pool{min-height:120px;border-radius:22px;background:#f7f1e9;padding:19px;display:flex;align-content:center;justify-content:center;gap:11px;flex-wrap:wrap}.block{border:1px solid #ddcdbb;border-radius:15px;background:#fff;color:#3c4439;padding:14px 19px;font-weight:850;box-shadow:0 4px 9px #705f4614;transition:.14s}.block:hover{transform:translateY(-2px);border-color:#c49975}.block:disabled{opacity:0;pointer-events:none}
.message{min-height:30px;margin-top:16px;text-align:center;font-weight:900}.right{color:#198764}.wrong{color:#d64e60}.tip{text-align:center;margin-top:8px;color:#8d9487;font-size:12px}.hidden{display:none!important}.party{font-size:74px}
@media(max-width:600px){body{padding:0}.app{min-height:100vh;border:0;border-radius:0}header{padding:23px}.body{padding:25px 19px}h1{font-size:29px}.korean{font-size:22px}.block,.chosen{padding:12px 14px}.pool{padding:14px}}
</style>
</head>
<body>
<main class="app">
<header><p class="tag">PHRASE BLOCKS</p><h1>의미 단위 문장 맞추기</h1><p>의미 단위로 묶인 영어 블록을 순서대로 클릭하세요.</p></header>
<section class="body">
  <div id="intro" class="center"><div class="emoji">🧩</div><h2>문장을 덩어리로 익혀요!</h2><p class="note">우리말 뜻을 읽고 의미 단위로 묶인 영어 블록을 올바른 순서로 클릭하세요. 선택한 블록을 다시 누르면 취소할 수 있어요.</p><button class="start" onclick="start()">학습 시작</button></div>
  <div id="game" class="hidden">
    <div class="top"><div class="bar"><div id="fill" class="fill"></div></div><span id="count" class="count"></span></div>
    <div class="prompt"><small>다음 문장을 영어로 완성하세요</small><p id="korean" class="korean"></p></div>
    <div id="answer" class="answer-box"><span class="placeholder">아래 블록을 순서대로 클릭하세요.</span></div>
    <p class="pool-label">PHRASE BLOCKS</p><div id="pool" class="pool"></div>
    <div id="message" class="message"></div><p class="tip">위 문장 칸의 블록을 누르면 선택을 취소할 수 있습니다.</p>
  </div>
  <div id="finish" class="center hidden"><div class="party">🎉</div><h2>10문장을 모두 완성했어요!</h2><p class="note">영어 문장의 의미 덩어리와 순서를 정확하게 익혔습니다.</p><button class="restart" onclick="restart()">처음부터 다시 하기</button></div>
</section>
</main>
<script>
const questions=[
 {p:["I","like","the lunch menu","today"],k:"나는 오늘 급식 메뉴가 마음에 든다."},
 {p:["She","played soccer","yesterday"],k:"그녀는 어제 축구를 했다."},
 {p:["We","finished","our English homework"],k:"우리는 영어 숙제를 끝냈다."},
 {p:["I","will do","my homework","after school"],k:"나는 방과 후에 숙제를 할 것이다."},
 {p:["He","joined","the movie club"],k:"그는 영화 동아리에 가입했다."},
 {p:["I","like","the school lunch"],k:"나는 학교 급식을 좋아한다."},
 {p:["She","will play","basketball","today"],k:"그녀는 오늘 농구를 할 것이다."},
 {p:["She","will finish","her homework"],k:"그녀는 숙제를 끝낼 것이다."},
 {p:["He","did","his homework","yesterday"],k:"그는 어제 숙제를 했다."},
 {p:["I","joined","the book club"],k:"나는 독서 동아리에 가입했다."}
];
let index=0,selected=[],locked=false,blocks=[];const $=id=>document.getElementById(id);
function shuffle(a){const b=[...a];do{for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}}while(b.length>1&&b.every((x,i)=>x.text===a[i].text));return b}
function start(){$("intro").classList.add("hidden");$("game").classList.remove("hidden");show()}
function show(){locked=false;selected=[];$("count").textContent=(index+1)+" / "+questions.length;$("fill").style.width=(index/questions.length*100)+"%";$("korean").textContent=questions[index].k;$("message").textContent="";$("message").className="message";blocks=shuffle(questions[index].p.map((text,id)=>({text,id})));render()}
function render(){const answer=$("answer"),pool=$("pool");answer.innerHTML="";pool.innerHTML="";if(!selected.length)answer.innerHTML='<span class="placeholder">아래 블록을 순서대로 클릭하세요.</span>';selected.forEach((x,pos)=>{const b=document.createElement("button");b.className="chosen";b.textContent=x.text;b.onclick=()=>remove(pos);answer.appendChild(b)});if(selected.length===blocks.length){const p=document.createElement("span");p.className="period";p.textContent=".";answer.appendChild(p)}blocks.forEach(x=>{const b=document.createElement("button");b.className="block";b.textContent=x.text;b.disabled=selected.some(s=>s.id===x.id);b.onclick=()=>choose(x);pool.appendChild(b)})}
function choose(x){if(locked)return;selected.push(x);render();if(selected.length===blocks.length)check()}
function remove(pos){if(locked)return;selected.splice(pos,1);$("message").textContent="";render()}
function check(){locked=true;const made=selected.map(x=>x.text).join(" ");const answer=questions[index].p.join(" ");if(made===answer){$("message").textContent="정답이에요! 문장을 완성했어요. ✨";$("message").className="message right";setTimeout(()=>{if(index===questions.length-1){$("game").classList.add("hidden");$("finish").classList.remove("hidden")}else{index++;show()}},900)}else{$("message").textContent="순서가 달라요. 다시 풀어 보세요.";$("message").className="message wrong";setTimeout(()=>{selected=[];locked=false;render();$("message").textContent=""},1100)}}
function restart(){index=0;$("finish").classList.add("hidden");$("game").classList.remove("hidden");show()}
</script>
</body></html>
