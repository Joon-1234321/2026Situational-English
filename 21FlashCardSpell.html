<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>4번 클릭 스펠링 플래시카드</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px;background:radial-gradient(circle at top,#f9fbfc,#eaf0f3 62%,#e2e8eb);font-family:Arial,"Noto Sans KR",sans-serif;color:#28343a}
.app{max-width:700px;margin:auto;background:#fff;border:1px solid #dce5e8;border-radius:32px;overflow:hidden;box-shadow:0 18px 50px #52636d24}header{padding:27px 36px;background:#3c5867;color:#fff}.tag{margin:0;color:#cfe8f2;font-size:13px;font-weight:900;letter-spacing:.18em}h1{margin:7px 0 0;font-size:34px}header p:last-child{margin:8px 0 0;color:#dce8ed}
.body{padding:32px 36px}.center{min-height:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.emoji{font-size:58px;width:104px;height:104px;display:grid;place-items:center;border-radius:50%;background:#e8f1f5}h2{margin:20px 0 9px;font-size:29px}.note{max-width:460px;margin:0;color:#69777e;line-height:1.7}
button{font:inherit;cursor:pointer}.start,.restart{margin-top:27px;border:0;border-radius:18px;padding:16px 38px;background:#dc7957;color:#fff;font-size:18px;font-weight:900}.restart{background:#3c5867}
.top{display:flex;align-items:center;gap:15px;margin-bottom:23px}.bar{height:10px;flex:1;overflow:hidden;border-radius:99px;background:#e3e9ec}.fill{height:100%;background:#dc7957;transition:width .3s}.count{white-space:nowrap;color:#64737b;font-weight:900}
.clicks{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px}.dot{width:12px;height:12px;border-radius:50%;background:#dce4e8;transition:.2s}.dot.on{background:#dc7957;transform:scale(1.08)}.click-label{margin-left:5px;color:#78878e;font-size:13px;font-weight:850}
.card{position:relative;min-height:310px;border:0;border-radius:28px;background:linear-gradient(145deg,#edf5f7,#f8fafb);width:100%;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:inset 0 0 0 1px #d9e4e8,0 10px 24px #4a68751c;transition:transform .14s}.card.clickable:active{transform:scale(.985)}.card small{color:#73838b;font-weight:850}.word{margin:16px 0 0;color:#31576a;font-size:48px;font-weight:950;line-height:1.15;overflow-wrap:anywhere}.meaning{margin:16px 0 0;color:#31576a;font-size:36px;font-weight:950;line-height:1.3;word-break:keep-all}.tap{position:absolute;bottom:20px;color:#84939a;font-size:12px;font-weight:850}
.test{width:100%}.test .meaning{font-size:32px;margin:9px 0 22px}.listen{border:1px solid #c9dbe3;border-radius:14px;background:#fff;padding:9px 15px;color:#3c6577;font-weight:850}
form{margin-top:22px;width:100%}label{display:block;margin-bottom:8px;color:#52636c;font-size:14px;font-weight:850}.row{display:flex;gap:9px}input{min-width:0;flex:1;height:60px;border:2px solid #c7d5db;border-radius:18px;padding:0 18px;font-size:22px;font-weight:800;outline:none}input:focus{border-color:#39758f;box-shadow:0 0 0 4px #39758f20}.submit{width:67px;border:0;border-radius:18px;background:#dc7957;color:#fff;font-size:28px;font-weight:900}
.message{min-height:30px;margin-top:14px;text-align:center;font-weight:900}.right{color:#168c68}.wrong{color:#da4f62}.hidden{display:none!important}.party{font-size:74px}
@media(max-width:560px){body{padding:0}.app{min-height:100vh;border:0;border-radius:0}header{padding:23px}.body{padding:24px 18px}h1{font-size:28px}.card{min-height:330px}.word{font-size:42px}.meaning{font-size:31px}input{font-size:20px}}
</style>
</head>
<body>
<main class="app">
<header><p class="tag">4-CLICK FLASHCARDS</p><h1>보고, 듣고, 스펠링 쓰기</h1><p>카드를 네 번 학습한 뒤 영어 철자를 입력하세요.</p></header>
<section class="body">
  <div id="intro" class="center"><div class="emoji">🃏</div><h2>플래시카드 학습을 시작해요!</h2><p class="note">카드를 클릭할 때마다 영어 발음을 들을 수 있습니다. 네 번째 클릭 후 뜻만 보고 스펠링을 정확히 입력하세요.</p><button class="start" onclick="start()">학습 시작</button></div>
  <div id="game" class="hidden">
    <div class="top"><div class="bar"><div id="fill" class="fill"></div></div><span id="count" class="count"></span></div>
    <div class="clicks"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span id="clickLabel" class="click-label"></span></div>
    <div id="card" class="card clickable" role="button" tabindex="0" aria-label="플래시카드 클릭">
      <small id="sideLabel"></small><div id="word" class="word"></div><div id="meaning" class="meaning hidden"></div><div id="tap" class="tap">카드를 클릭하세요</div>
      <div id="test" class="test hidden">
        <small>뜻을 보고 영어 스펠링을 입력하세요</small><div id="testMeaning" class="meaning"></div><button id="listen" class="listen" type="button">🔊 다시 듣기</button>
        <form id="form" autocomplete="off"><label for="answer">영어 스펠링 입력</label><div class="row"><input id="answer" type="text" placeholder="영어로 입력하세요" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" inputmode="text" enterkeyhint="done" aria-autocomplete="none" data-lpignore="true" data-1p-ignore="true"><button class="submit" type="submit" aria-label="정답 확인">→</button></div></form>
        <div id="message" class="message"></div>
      </div>
    </div>
  </div>
  <div id="finish" class="center hidden"><div class="party">🎉</div><h2>10개 단어를 모두 완성했어요!</h2><p class="note">뜻과 발음, 영어 스펠링을 모두 정확하게 익혔습니다.</p><button class="restart" onclick="restart()">처음부터 다시 하기</button></div>
</section>
</main>
<script>
const cards=[
 {w:"always",m:"항상"},{w:"on",m:"~에, ~에서"},{w:"travel",m:"여행하다"},{w:"vlog",m:"브이로그"},{w:"sleep",m:"자다"},
 {w:"from",m:"~에서, ~로부터"},{w:"chat",m:"채팅하다"},{w:"tweet",m:"트윗하다"},{w:"cry",m:"울다"},{w:"meet",m:"만나다"}
];
let index=0,clicks=0,testing=false,busy=false;const $=id=>document.getElementById(id);
function speak(){if(!("speechSynthesis" in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cards[index].w);u.lang="en-US";u.rate=.76;const voices=window.speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==="en-US")||voices.find(v=>v.lang.startsWith("en"))||null;window.speechSynthesis.speak(u)}
function start(){$("intro").classList.add("hidden");$("game").classList.remove("hidden");showCard();speak()}
function showCard(){clicks=0;testing=false;busy=false;$("count").textContent=(index+1)+" / "+cards.length;$("fill").style.width=(index/cards.length*100)+"%";$("word").textContent=cards[index].w;$("meaning").textContent=cards[index].m;$("testMeaning").textContent=cards[index].m;$("sideLabel").textContent="ENGLISH";$("word").classList.remove("hidden");$("meaning").classList.add("hidden");$("test").classList.add("hidden");$("tap").classList.remove("hidden");$("card").classList.add("clickable");$("card").setAttribute("tabindex","0");$("message").textContent="";updateDots()}
function updateDots(){document.querySelectorAll(".dot").forEach((d,i)=>d.classList.toggle("on",i<clicks));$("clickLabel").textContent=clicks+" / 4 클릭"}
function cardClick(){if(testing||busy)return;clicks++;speak();updateDots();if(clicks===4){openTest();return}const showMeaning=clicks%2===1;$("sideLabel").textContent=showMeaning?"뜻":"ENGLISH";$("word").classList.toggle("hidden",showMeaning);$("meaning").classList.toggle("hidden",!showMeaning)}
function openTest(){testing=true;$("word").classList.add("hidden");$("meaning").classList.add("hidden");$("sideLabel").textContent="SPELLING TEST";$("tap").classList.add("hidden");$("test").classList.remove("hidden");$("card").classList.remove("clickable");$("card").removeAttribute("tabindex");const input=$("answer");input.value="";input.name="spell-"+index+"-"+Date.now()+"-"+Math.random().toString(36).slice(2);input.setAttribute("autocomplete","off");setTimeout(()=>input.focus(),100)}
$("card").addEventListener("click",e=>{if(e.target.closest("form")||e.target.closest("#listen"))return;cardClick()});
$("card").addEventListener("keydown",e=>{if(!testing&&(e.key==="Enter"||e.key===" ")){e.preventDefault();cardClick()}});
$("listen").addEventListener("click",e=>{e.stopPropagation();speak()});
$("answer").addEventListener("input",()=>{if(testing&&!busy&&$("answer").value.trim().toLowerCase()===cards[index].w)$("form").requestSubmit()});
$("form").addEventListener("submit",e=>{e.preventDefault();e.stopPropagation();if(busy)return;const input=$("answer");if(!input.value.trim())return;if(input.value.trim().toLowerCase()===cards[index].w){busy=true;$("message").textContent="정답이에요! ✨";$("message").className="message right";setTimeout(()=>{if(index===cards.length-1){$("game").classList.add("hidden");$("finish").classList.remove("hidden")}else{index++;showCard();speak()}},750)}else{input.value="";$("message").textContent="철자를 다시 확인해 보세요.";$("message").className="message wrong";input.name="spell-"+index+"-"+Date.now()+"-"+Math.random().toString(36).slice(2);input.focus()}});
function restart(){index=0;$("finish").classList.add("hidden");$("game").classList.remove("hidden");showCard();speak()}
</script>
</body></html>
