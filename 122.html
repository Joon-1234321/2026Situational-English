<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영어 문장 순서 맞추기 - 낱말 블록</title><style>
:root{--i:#27364a;--g:#477a68;--m:#e6f2ed}*{box-sizing:border-box}body{margin:0;background:#f8f7f2;color:var(--i);font-family:Arial,"Malgun Gothic",sans-serif}.wrap{max-width:900px;margin:auto;padding:38px 18px}.head{margin-bottom:22px}small{color:var(--g);font-weight:800;letter-spacing:.15em}h1{margin:7px 0 0;font-size:30px}.card{background:#fff;border:1px solid #e4e8e5;border-radius:27px;padding:30px 34px;text-align:center;box-shadow:0 18px 50px #4d5b5212}.progress{display:flex;justify-content:space-between;color:#718096;font-weight:700;font-size:14px}.bar{height:6px;background:#edf0ee;border-radius:9px;margin:12px 0 35px}.bar i{display:block;height:100%;background:var(--g);border-radius:9px}.ko b{display:inline-block;background:var(--m);color:var(--g);padding:6px 11px;border-radius:20px;font-size:12px}.ko h2{font-size:27px;margin:14px 0 25px}.answer{min-height:82px;border:2px dashed #cbd7d3;border-radius:18px;background:#fafcfb;padding:15px;display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;color:#9aa5a1}.answer button,.choices button{border:1px solid #cfdad6;background:#fff;color:var(--i);border-radius:13px;padding:11px 15px;font-size:17px;font-weight:700;box-shadow:0 2px 0 #dfe6e3}.answer button{background:var(--m)}.choices{min-height:110px;display:flex;justify-content:center;align-items:center;gap:11px;flex-wrap:wrap;padding:24px 5px}.choices button:disabled{opacity:.23}.msg{min-height:44px;color:#77837f;font-weight:700}.retry,.restart{border:0;background:var(--g);color:white;border-radius:13px;padding:13px 24px;font-weight:800}.tip{font-size:13px;color:#9aa29f}.finish{padding:55px 10px}.star{font-size:55px;color:#b38d29}@media(max-width:680px){.wrap{padding:24px 13px}.card{padding:23px 16px}.ko h2{font-size:22px}.answer button,.choices button{font-size:15px;padding:10px 12px}}
</style></head><body><main class="wrap"><div class="head"><small>ENGLISH BUILDER · 낱말 하나씩</small><h1>영어 문장 순서 맞추기 - 낱말 블록</h1></div><section class="card" id="app"></section></main><script>
const data=[
["그녀는 나의 담임 선생님이다.","She is my homeroom teacher.",["She","is","my homeroom teacher"]],
["그들은 나의 반 친구들이다.","They are my classmates.",["They","are","my classmates"]],
["내가 가장 좋아하는 과목은 영어이다.","My favorite subject is English.",["My favorite subject","is","English"]],
["그 교실은 깨끗하다.","The classroom is clean.",["The classroom","is","clean"]],
["나는 학교에 지각하지 않는다.","I am not late for school.",["I","am not","late for school"]],
["김 선생님은 그의 담임 선생님이다.","Mr. Kim is his homeroom teacher.",["Mr. Kim","is","his homeroom teacher"]],
["그녀는 나의 반 친구이다.","She is my classmate.",["She","is","my classmate"]],
["내가 가장 좋아하는 과목은 수학이다.","My favorite subject is math.",["My favorite subject","is","math"]],
["우리 교실은 작지 않다.","Our classroom is not small.",["Our classroom","is not","small"]],
["그녀는 매일 학교에 지각한다.","She is late for school every day.",["She","is","late for school","every day"]]];
let n=0,picked=[],opts=[],locked=false;const word=true;const app=document.querySelector("#app");
function mix(a){a=a.map((t,i)=>({t,id:i}));for(let i=a.length-1;i;i--){let j=(i*7+n*3+(word?5:2))%(i+1);[a[i],a[j]]=[a[j],a[i]]}if(a.every((x,i)=>x.id===i)&&a.length>1)[a[0],a[1]]=[a[1],a[0]];return a}
function reset(){picked=[];locked=false;opts=mix(word?data[n][1].slice(0,-1).split(" "):data[n][2]);draw()}
function draw(msg="블록을 차례대로 눌러 보세요.",bad=false){app.innerHTML='<div class="progress"><span>낱말 하나씩</span><strong>'+(n+1)+' / 10</strong></div><div class="bar"><i style="width:'+((n+1)*10)+'%"></i></div><div class="ko"><b>우리말</b><h2>'+data[n][0]+'</h2></div><div class="answer">'+(picked.length?picked.map(id=>'<button data-undo="'+id+'">'+opts.find(x=>x.id==id).t+'</button>').join("")+' <strong>.</strong>':"여기에 문장을 완성해 보세요")+'</div><div class="choices">'+opts.map(x=>'<button data-id="'+x.id+'" '+(picked.includes(x.id)||locked?"disabled":"")+'>'+x.t+'</button>').join("")+'</div><div class="msg" style="color:'+(bad?"#9b514c":msg.startsWith("정답")?"#477a68":"#77837f")+'">'+msg+'</div>'+(bad?'<button class="retry">다시 풀기</button>':'')+'<p class="tip">선택한 블록을 다시 누르면 취소할 수 있어요.</p>';bind()}
function bind(){document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{if(locked)return;picked.push(+b.dataset.id);if(picked.length===opts.length){locked=true;let made=picked.map(id=>opts.find(x=>x.id===id).t).join(" ")+'.';if(made===data[n][1]){draw("정답이에요! 참 잘했어요 🎉");setTimeout(()=>{if(n===9)finish();else{n++;reset()}},900)}else draw("순서를 다시 생각해 보세요. 다시 풀 수 있어요!",true)}else draw()});document.querySelectorAll("[data-undo]").forEach(b=>b.onclick=()=>{if(!locked){picked=picked.filter(x=>x!==+b.dataset.undo);draw()}});let r=document.querySelector(".retry");if(r)r.onclick=reset}
function finish(){app.innerHTML='<div class="finish"><div class="star">★</div><small>ALL CLEAR</small><h2>10문제를 모두 완성했어요!</h2><p>끝까지 집중한 모습이 정말 멋져요.</p><button class="restart">처음부터 다시 하기</button></div>';document.querySelector(".restart").onclick=()=>{n=0;reset()}}reset();
</script></body></html>
