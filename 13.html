<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>우리말 보고 영어 문장 쓰기</title>
  <style>
    :root{--paper:#f4f2ec;--ink:#24302d;--muted:#6b7470;--sage:#587569;--sage-dark:#3e5d52;--sage-soft:#e7eee9;--sand:#eee4d3;--error:#a35f58;--success:#3f765d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 8%,rgba(208,224,214,.78),transparent 31rem),radial-gradient(circle at 92% 90%,rgba(238,223,200,.72),transparent 30rem),var(--paper);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif}button,input{font:inherit}.shell{min-height:100vh;display:grid;place-items:center;padding:30px 18px}.card{width:min(820px,100%);min-height:650px;padding:38px 44px 30px;background:rgba(255,255,255,.92);border:1px solid rgba(88,117,105,.2);border-radius:30px;box-shadow:0 24px 70px rgba(50,67,59,.12)}
    .header{display:flex;justify-content:space-between;align-items:flex-start;gap:22px}.eyebrow{margin:0 0 8px;color:var(--sage);font-size:12px;font-weight:850;letter-spacing:.15em}h1{margin:0;font-size:clamp(26px,4vw,38px);line-height:1.2;letter-spacing:-.04em}.counter{min-width:76px;padding:12px 16px;border-radius:18px;background:var(--sage-soft);color:var(--sage-dark);text-align:center}.counter strong{font-size:24px}.counter span{color:var(--muted);font-weight:750}.progress{height:7px;margin:24px 0 31px;overflow:hidden;border-radius:999px;background:#edf0ed}.progress-fill{height:100%;border-radius:inherit;background:var(--sage);transition:width .35s}.prompt{padding:25px 24px 23px;border:1px solid #e6ded1;border-radius:22px;background:#faf7f1}.label{display:inline-block;margin-bottom:11px;padding:5px 10px;border-radius:9px;background:var(--sand);color:#755f42;font-size:12px;font-weight:850}.prompt h2{margin:0;font-size:clamp(22px,3.5vw,30px);letter-spacing:-.035em}.prompt p{margin:11px 0 0;color:var(--muted);font-size:14px}
    form{margin-top:27px}form label{display:block;margin:0 0 9px 3px;font-size:13px;font-weight:800;color:#57625d}.input-wrap{display:flex;gap:10px;padding:7px;border:2px solid #cbd5cf;border-radius:18px;background:#fff;box-shadow:0 5px 18px rgba(52,69,61,.06);transition:.2s}.input-wrap:focus-within{border-color:#87a396;box-shadow:0 0 0 4px rgba(88,117,105,.11)}.input-wrap.wrong{border-color:#c9908a;animation:shake .35s}.input-wrap.correct{border-color:#78a68f;background:#f4faf6}.input-wrap input{width:100%;min-width:0;border:0;outline:0;padding:11px 12px;background:transparent;color:var(--ink);font-size:clamp(18px,3vw,24px);font-weight:650}.input-wrap input::placeholder{color:#a2aaa6;font-weight:500}.input-wrap button,.primary{border:0;border-radius:12px;padding:12px 20px;background:var(--sage-dark);color:#fff;font-weight:850;cursor:pointer;box-shadow:0 4px 0 #2f493f}.input-wrap button:disabled{opacity:.35;cursor:default;box-shadow:none}.feedback{min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;text-align:center;color:var(--muted);font-size:14px}.feedback.correct{color:var(--success)}.feedback.wrong{color:var(--error)}.feedback strong{font-weight:900}
    .hint{margin-top:6px;padding:18px 20px;border:1px solid #dbcba9;border-radius:19px;background:#fffaf0;animation:rise .35s}.hint-head{display:flex;align-items:center;gap:12px}.hint-head>span{display:grid;width:34px;height:34px;place-items:center;border-radius:11px;background:#ead9b9;color:#775f33;font-weight:900}.hint-head strong{font-size:15px}.hint-head p{margin:3px 0 0;color:#7d725f;font-size:12px}.hint-row{display:flex;align-items:center;gap:10px;margin-top:14px}.hint-row em{font-style:normal;color:#7d725f;font-size:12px;font-weight:850}.words{display:flex;flex-wrap:wrap;gap:8px}.words span{padding:8px 12px;border:1px solid #d8c8a9;border-radius:11px;background:#fff;color:#554936;font-weight:800;box-shadow:0 3px 0 #eadfcb}.footer{margin-top:25px;padding-top:20px;border-top:1px solid #e5e9e6;color:var(--muted);font-size:13px;text-align:center}.footer kbd{padding:3px 7px;border:1px solid #cdd4d0;border-radius:6px;background:#f8faf8;color:#4e5d56;font-size:11px;font-weight:850;box-shadow:0 2px 0 #d9dfdb}
    .finish{min-height:560px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.mark{display:grid;width:82px;height:82px;place-items:center;margin-bottom:24px;border-radius:28px;background:var(--sage-soft);color:var(--success);font-size:40px;font-weight:900;animation:pop .45s}.finish>p:not(.eyebrow){margin:17px 0;color:var(--muted)}.score{display:flex;align-items:baseline;gap:5px;margin:4px 0 29px;color:var(--sage-dark)}.score strong{font-size:48px}.score span{font-weight:800}.primary{padding:14px 22px}
    @keyframes shake{0%,100%{transform:translateX(0)}30%{transform:translateX(-6px)}70%{transform:translateX(6px)}}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes pop{from{opacity:0;transform:scale(.65)}to{opacity:1;transform:scale(1)}}@media(max-width:640px){.shell{padding:12px;place-items:stretch}.card{min-height:calc(100vh - 24px);padding:26px 20px 22px;border-radius:24px}.header{align-items:center}.counter{min-width:66px;padding:9px 11px}.counter strong{font-size:20px}.prompt{padding:20px 18px}.input-wrap{display:block}.input-wrap button{width:100%;margin-top:5px}.feedback{align-items:flex-start;flex-direction:column;gap:2px}.hint-row{align-items:flex-start;flex-direction:column}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="shell"><section class="card" id="game" aria-labelledby="title"></section></main>
  <script>
    const questions=[
      {korean:"나의 학교는 늦게 끝난다.",answers:["My school ends late"],hints:[["late","school","My","ends"]]},
      {korean:"나는 매일 학교로 걸어간다.",answers:["I walk to school every day"],hints:[["every","school","walk","day","I","to"]]},
      {korean:"나는 일찍 일어난다.",answers:["I wake up early","I get up early"],hints:[["early","I","up","wake"],["get","early","I","up"]]},
      {korean:"나는 어제 학교에 걸어갔다.",answers:["I walked to school yesterday"],hints:[["yesterday","school","walked","I","to"]]},
      {korean:"그는 어제 일찍 일어났다.",answers:["He woke up early yesterday","He got up early yesterday"],hints:[["yesterday","up","He","early","woke"],["got","He","yesterday","early","up"]]},
      {korean:"그는 아침에 일찍 일어난다.",answers:["He wakes up early in the morning","He gets up early in the morning"],hints:[["morning","up","the","He","early","in","wakes"],["gets","the","He","morning","early","up","in"]]}
    ];
    const game=document.getElementById("game");let index=0,wrong=0,status="playing",timer=null;
    const norm=v=>v.trim().replace(/[.!?]+$/g,"").replace(/\s+/g," ").toLowerCase();
    const esc=v=>v.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
    function render(){
      if(status==="done"){game.className="card finish";game.innerHTML=`<div class="mark" aria-hidden="true">✓</div><p class="eyebrow">WRITING COMPLETE</p><h1 id="title">모든 문장을 완성했어요!</h1><p>여섯 문장을 영어로 정확하게 썼습니다.</p><div class="score"><strong>6</strong><span>/ 6 문장</span></div><button class="primary" onclick="restart()">처음부터 다시 풀기</button>`;return}
      game.className="card";const q=questions[index];const hints=wrong>=3?`<aside class="hint" aria-label="단어 힌트"><div class="hint-head"><span>?</span><div><strong>단어 힌트를 보고 다시 써 보세요.</strong><p>단어가 무순으로 섞여 있습니다.</p></div></div>${q.hints.map((row,i)=>`<div class="hint-row">${q.hints.length>1?`<em>답 ${i+1}</em>`:""}<div class="words">${row.map(w=>`<span>${esc(w)}</span>`).join("")}</div></div>`).join("")}</aside>`:"";
      const feedback=status==="correct"?`<strong>정답이에요!</strong><span>다음 문제로 이동합니다.</span>`:status==="wrong"?`<strong>아직 정답이 아니에요.</strong><span>같은 문제를 다시 입력해 보세요.</span>`:wrong?`<span>오답 ${wrong}회 · 천천히 다시 생각해 보세요.</span>`:`<span>대소문자와 마지막 마침표는 채점에 영향을 주지 않아요.</span>`;
      game.innerHTML=`<header class="header"><div><p class="eyebrow">KOREAN → ENGLISH</p><h1 id="title">우리말 보고 영어 문장 쓰기</h1></div><div class="counter" aria-label="${questions.length}문제 중 ${index+1}번 문제"><strong>${index+1}</strong><span>/ ${questions.length}</span></div></header><div class="progress"><div class="progress-fill" style="width:${index/questions.length*100}%"></div></div><div class="prompt"><span class="label">우리말</span><h2>${q.korean}</h2><p>알맞은 영어 문장을 입력하고 Enter를 누르세요.</p></div><form onsubmit="check(event)"><label for="answer">영어 문장</label><div class="input-wrap ${status}"><input id="answer" placeholder="영어로 문장을 써 보세요" autocomplete="off" spellcheck="false" oninput="typing()" ${status==="correct"?"disabled":""}><button id="submit" type="submit" disabled>확인</button></div></form><div class="feedback ${status}" role="status" aria-live="polite">${feedback}</div>${hints}<div class="footer"><kbd>Enter</kbd> 키를 누르면 바로 채점됩니다.</div>`;
      const input=document.getElementById("answer");input.focus();input.addEventListener("input",()=>document.getElementById("submit").disabled=!input.value.trim());
    }
    function typing(){if(status==="wrong"){status="playing";document.querySelector(".input-wrap").className="input-wrap";document.querySelector(".feedback").className="feedback";document.querySelector(".feedback").innerHTML=`<span>오답 ${wrong}회 · 천천히 다시 생각해 보세요.</span>`}}
    function check(e){e.preventDefault();const input=document.getElementById("answer");if(!input.value.trim()||status==="correct")return;if(questions[index].answers.some(a=>norm(a)===norm(input.value))){status="correct";render();timer=setTimeout(()=>{if(index===questions.length-1)status="done";else{index++;wrong=0;status="playing"}render()},900)}else{wrong++;status="wrong";render()}}
    function restart(){clearTimeout(timer);index=0;wrong=0;status="playing";render()}
    render();
  </script>
</body>
</html>
