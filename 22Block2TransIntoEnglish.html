<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>문장 변환 영작 타이핑</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px;background:radial-gradient(circle at top,#faf9fc,#eeeaf2 62%,#e6e1e9);font-family:Arial,"Noto Sans KR",sans-serif;color:#302d35}.app{max-width:760px;margin:auto;background:#fff;border:1px solid #e3dfe7;border-radius:32px;overflow:hidden;box-shadow:0 18px 50px #62566b26}header{padding:28px 38px;background:#5b4e67;color:#fff}.tag{margin:0;color:#eadcf2;font-size:13px;font-weight:900;letter-spacing:.18em}h1{margin:7px 0 0;font-size:35px}header p:last-child{margin:8px 0 0;color:#ece5f0}.body{padding:36px 38px}.center{min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.emoji{font-size:58px;width:104px;height:104px;display:grid;place-items:center;border-radius:50%;background:#f2ecf5}h2{margin:20px 0 9px;font-size:29px}.note{max-width:490px;margin:0;color:#767078;line-height:1.7}button{font:inherit;cursor:pointer}.start,.restart{margin-top:27px;border:0;border-radius:18px;padding:16px 38px;background:#d47758;color:#fff;font-size:18px;font-weight:900}.restart{background:#5b4e67}.top{display:flex;align-items:center;gap:16px;margin-bottom:28px}.bar{height:10px;flex:1;overflow:hidden;border-radius:99px;background:#e9e4ec}.fill{height:100%;background:#d47758;transition:width .3s}.count{white-space:nowrap;color:#716a74;font-weight:900}.prompt{min-height:195px;border-radius:25px;background:#f5f2f7;padding:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.prompt small{color:#807787;font-weight:800}.korean{margin:13px 0 0;color:#504657;font-size:27px;font-weight:900;line-height:1.45;word-break:keep-all}.hint{margin-top:18px;padding:17px;border:1px solid #efcd86;border-radius:19px;background:#fff8e7;text-align:center;color:#845514}.hint p{margin:0;font-weight:800}.words{margin-top:10px!important;font-size:17px;line-height:1.8;color:#a15e25;overflow-wrap:anywhere}form{margin-top:24px}label{display:block;margin-bottom:8px;color:#5d5661;font-size:14px;font-weight:850}.row{display:flex;gap:9px}input{min-width:0;flex:1;height:60px;border:2px solid #d3cbd7;border-radius:18px;padding:0 18px;font-size:19px;font-weight:750;outline:none}input:focus{border-color:#7a6388;box-shadow:0 0 0 4px #7a638820}.submit{width:67px;border:0;border-radius:18px;background:#d47758;color:#fff;font-size:28px;font-weight:900}.message{min-height:30px;margin-top:15px;text-align:center;font-weight:900}.right{color:#168c68}.wrong{color:#da4f62}.tries{text-align:center;color:#918a94;font-size:12px}.hidden{display:none!important}.party{font-size:74px}@media(max-width:560px){body{padding:0}.app{min-height:100vh;border:0;border-radius:0}header{padding:23px}.body{padding:25px 19px}h1{font-size:29px}.korean{font-size:23px}input{font-size:17px;padding:0 14px}}
</style>
</head>
<body>
<main class="app">
<header><p class="tag">KOREAN → ENGLISH</p><h1>문장 변환 영작 타이핑</h1><p>우리말 뜻을 보고 영어 문장을 정확하게 입력하세요.</p></header>
<section class="body">
<div id="intro" class="center"><div class="emoji">⌨️</div><h2>영작 연습을 시작해요!</h2><p class="note">부정문·과거·미래 문장을 영어로 입력하세요. 정답이 완성되면 자동으로 다음 문제로 넘어가며, 세 번 틀리면 단어 힌트가 나타납니다.</p><button class="start" onclick="start()">학습 시작</button></div>
<div id="game" class="hidden"><div class="top"><div class="bar"><div id="fill" class="fill"></div></div><span id="count" class="count"></span></div><div class="prompt"><small>다음 문장을 영어로 쓰세요</small><p id="korean" class="korean"></p></div><div id="hint" class="hint hidden"><p>단어를 올바른 순서로 배열해 입력하세요.</p><p id="words" class="words"></p></div><form id="form" autocomplete="off"><label for="answer">영어 문장 입력</label><div class="row"><input id="answer" type="text" placeholder="영어 문장을 입력하세요" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" inputmode="text" enterkeyhint="done" aria-autocomplete="none" data-lpignore="true" data-1p-ignore="true"><button class="submit" type="submit" aria-label="정답 확인">→</button></div></form><div id="message" class="message"></div><div id="tries" class="tries"></div></div>
<div id="finish" class="center hidden"><div class="party">🎉</div><h2>10문장을 모두 완성했어요!</h2><p class="note">부정문·과거·미래 문장을 정확하게 입력했습니다.</p><button class="restart" onclick="restart()">처음부터 다시 하기</button></div>
</section>
</main>
<script>
const questions=[
 {k:"미나는 유명한 유튜버가 아니다.",answers:["Mina is not a famous YouTuber.","Mina isn't a famous YouTuber."]},
 {k:"이곳은 사진을 찍기에 좋은 장소였다.",answers:["This was a good place for pictures.","This was a good place for photos.","This was a good place for a photo."]},
 {k:"그의 영상들은 재미있다.",answers:["His videos are funny."]},
 {k:"그녀는 인스타그램 사진에서 멋져 보였다.",answers:["She looked cool in her Instagram photos."]},
 {k:"그들은 인기를 얻게 될 것이다.",answers:["They will get popular.","They will become popular.","They will be popular."]},
 {k:"그는 유명한 유튜버이다.",answers:["He is a famous YouTuber."]},
 {k:"그 노래는 틱톡에서 인기가 있을 것이다.",answers:["The song will be popular on TikTok.","The song will become popular on TikTok.","The song will get popular on TikTok."]},
 {k:"그의 영상들은 항상 재미있었다.",answers:["His videos were always funny."]},
 {k:"수민은 영상에서 좋아 보이지 않는다.",answers:["Sumin does not look good in the video.","Sumin doesn't look good in the video."]},
 {k:"톰의 브이로그는 지루해지고 있지 않다.",answers:["Tom's vlogs are not getting boring.","Tom's vlogs aren't getting boring."]}
];
let index=0,mistakes=0,busy=false;const $=id=>document.getElementById(id);
function normalize(s){return s.trim().toLowerCase().replace(/[’]/g,"'").replace(/[.!?]+$/,"").replace(/\s+/g," ")}
function isCorrect(value){return questions[index].answers.some(a=>normalize(value)===normalize(a))}
function shuffled(sentence){const original=sentence.replace(/[.!?]+$/,"").split(" ");let a=[...original];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}if(a.join(" ")===original.join(" "))a.reverse();return a.join("  ·  ")}
function start(){$("intro").classList.add("hidden");$("game").classList.remove("hidden");show()}
function show(){busy=false;mistakes=0;$("count").textContent=(index+1)+" / "+questions.length;$("fill").style.width=(index/questions.length*100)+"%";$("korean").textContent=questions[index].k;const input=$("answer");input.value="";input.name="transform-"+index+"-"+Date.now()+"-"+Math.random().toString(36).slice(2);input.setAttribute("autocomplete","off");$("message").textContent="";$("message").className="message";$("tries").textContent="";$("hint").classList.add("hidden");setTimeout(()=>input.focus(),100)}
function message(text,right){$("message").textContent=text;$("message").className="message "+(right?"right":"wrong")}
function complete(){if(busy)return;busy=true;message("정답이에요! 잘 썼어요. ✨",true);setTimeout(()=>{if(index===questions.length-1){$("game").classList.add("hidden");$("finish").classList.remove("hidden")}else{index++;show()}},750)}
$("answer").addEventListener("input",()=>{if(!busy&&isCorrect($("answer").value))complete()});
$("form").addEventListener("submit",e=>{e.preventDefault();if(busy)return;const input=$("answer");if(!input.value.trim())return;if(isCorrect(input.value)){complete()}else{mistakes++;input.value="";message("아쉬워요. 다시 입력해 보세요.",false);$("tries").textContent="오답 "+mistakes+"회";input.name="transform-"+index+"-"+Date.now()+"-"+Math.random().toString(36).slice(2);if(mistakes>=3){$("words").textContent=shuffled(questions[index].answers[0]);$("hint").classList.remove("hidden")}input.focus()}});
function restart(){index=0;$("finish").classList.add("hidden");$("game").classList.remove("hidden");show()}
</script>
</body></html>
