<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>뜻 보고 스펠링 쓰기</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 16px;background:radial-gradient(circle at top,#fafcfb,#edf3f2 58%,#e4eceb);font-family:Arial,"Noto Sans KR",sans-serif;color:#1f2937}
.app{max-width:680px;margin:auto;background:#fff;border:1px solid #dbe4e4;border-radius:32px;overflow:hidden;box-shadow:0 18px 48px #6b849226}
header{padding:28px 38px;background:#405b52;color:#fff}.tag{margin:0;color:#d9eee7;font-size:13px;font-weight:800;letter-spacing:.18em}h1{margin:8px 0 0;font-size:36px}header p:last-child{margin:8px 0 0;color:#e1ebe7}
.body{padding:36px}.center{min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.emoji{font-size:56px;width:100px;height:100px;display:grid;place-items:center;background:#eaf3ee;border-radius:50%}
h2{font-size:28px;margin:20px 0 8px}.note{max-width:420px;color:#64748b;line-height:1.7;margin:0}
button{border:0;cursor:pointer;font:inherit}.start,.restart{margin-top:26px;padding:16px 38px;border-radius:18px;background:#d97a55;color:#fff;font-weight:800;font-size:18px}.restart{background:#405b52}
.top{display:flex;align-items:center;gap:16px;margin-bottom:28px}.bar{height:10px;background:#e3ebeb;border-radius:99px;flex:1;overflow:hidden}.fill{height:100%;background:#d97a55;transition:width .3s}.count{white-space:nowrap;color:#64748b;font-weight:800}
.question{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f2f7f4;border-radius:26px;text-align:center;padding:28px}.question small{color:#64748b;font-size:14px;font-weight:800}.meaning{margin:14px 0 0;font-size:32px;font-weight:900;color:#2f4c43;word-break:keep-all}
.hint{margin-top:18px;padding:16px;border:1px solid #f1d18a;border-radius:18px;background:#fff8e8;text-align:center;color:#8a5815}.hint p{margin:0;font-weight:800}.letters{margin-top:9px!important;font-size:18px;letter-spacing:2px;overflow-wrap:anywhere}
form{margin-top:24px}label{display:block;margin-bottom:8px;color:#475569;font-size:14px;font-weight:800}.row{display:flex;gap:9px}input{min-width:0;flex:1;height:58px;border:2px solid #cad7d8;border-radius:18px;padding:0 18px;font-size:20px;font-weight:800;outline:none}input:focus{border-color:#4c796b;box-shadow:0 0 0 4px #4c796b22}.submit{width:66px;border-radius:18px;background:#d97a55;color:#fff;font-size:28px;font-weight:900}
.message{height:28px;margin-top:14px;text-align:center;font-weight:800}.wrong{color:#e04f62}.right{color:#15966b}.hidden{display:none!important}.party{font-size:72px}
@media(max-width:520px){body{padding:0}.app{min-height:100vh;border:0;border-radius:0}header{padding:24px}.body{padding:26px 22px}h1{font-size:30px}.meaning{font-size:27px}}
</style>
</head>
<body>
<main class="app">
<header><p class="tag">MEANING &amp; SPELLING</p><h1>뜻 보고 스펠링 쓰기</h1><p>우리말 뜻에 맞는 영어 철자를 입력하세요.</p></header>
<section class="body">
  <div id="intro" class="center"><div class="emoji">✏️</div><h2>스펠링 연습을 시작해요!</h2><p class="note">우리말 뜻을 보고 영어 단어나 표현을 입력하세요. 세 번 틀리면 섞인 철자 힌트가 나타납니다.</p><button class="start" onclick="start()">학습 시작</button></div>
  <div id="game" class="hidden">
    <div class="top"><div class="bar"><div id="fill" class="fill"></div></div><span id="count" class="count"></span></div>
    <div class="question"><small>다음 뜻을 영어로 쓰세요</small><p id="meaning" class="meaning"></p></div>
    <div id="hint" class="hint hidden"><p>섞인 철자를 보고 다시 입력해 보세요.</p><p id="letters" class="letters"></p></div>
    <form id="form" autocomplete="off"><label for="answer">영어 스펠링 입력</label><div class="row"><input id="answer" type="text" placeholder="영어로 입력하세요" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><button class="submit" type="submit" aria-label="정답 확인">→</button></div></form>
    <div id="message" class="message"></div>
  </div>
  <div id="finish" class="center hidden"><div class="party">🎉</div><h2>모두 완성했어요!</h2><p class="note">10개 표현의 스펠링을 모두 맞혔습니다.</p><button class="restart" onclick="restart()">처음부터 다시 하기</button></div>
</section>
</main>
<script>
const words=[
 {a:"play",k:"놀다, 경기하다"},{a:"soccer",k:"축구"},{a:"do",k:"하다"},{a:"homework",k:"숙제"},{a:"finish",k:"끝내다"},
 {a:"after school",k:"방과 후에"},{a:"join",k:"참여하다, 가입하다"},{a:"tomorrow",k:"내일"},{a:"today",k:"오늘"},{a:"yesterday",k:"어제"}
];
let index=0,mistakes=0,busy=false;const $=id=>document.getElementById(id);
function start(){$("intro").classList.add("hidden");$("game").classList.remove("hidden");show()}
function show(){$("count").textContent=(index+1)+" / "+words.length;$("fill").style.width=(index/words.length*100)+"%";$("meaning").textContent=words[index].k;$("answer").value="";$("message").textContent="";$("message").className="message";$("hint").classList.add("hidden");mistakes=0;busy=false;setTimeout(()=>$("answer").focus(),100)}
function shuffled(text){return text.split(" ").map(w=>{let a=[...w];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}if(a.join("").toLowerCase()===w.toLowerCase()&&a.length>1)[a[0],a[1]]=[a[1],a[0]];return a.join(" · ")}).join("   /   ")}
function msg(t,right){$("message").textContent=t;$("message").className="message "+(right?"right":"wrong")}
$("form").addEventListener("submit",e=>{e.preventDefault();if(busy)return;const val=$("answer").value.trim().toLowerCase().replace(/\s+/g," ");if(!val)return;if(val===words[index].a){busy=true;msg("정답이에요! ✨",true);setTimeout(()=>{if(index===words.length-1){$("game").classList.add("hidden");$("finish").classList.remove("hidden")}else{index++;show()}},650)}else{mistakes++;$("answer").value="";msg("아쉬워요. 다시 입력해 보세요.",false);if(mistakes>=3){$("letters").textContent=shuffled(words[index].a);$("hint").classList.remove("hidden")}$("answer").focus()}});
function restart(){index=0;$("finish").classList.add("hidden");$("game").classList.remove("hidden");show()}
</script>
</body></html>
