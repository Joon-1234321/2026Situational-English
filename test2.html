<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>30문장 영어 단어 블록게임</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px;background:radial-gradient(circle at top,#f9fbfc,#ebf0f3 62%,#e2e8eb);font-family:Arial,"Noto Sans KR",sans-serif;color:#28343a;-webkit-tap-highlight-color:transparent}.app{max-width:820px;margin:auto;background:#fff;border:1px solid #dce5e8;border-radius:32px;overflow:hidden;box-shadow:0 18px 50px #52636d24}header{padding:28px 38px;background:#3c5867;color:#fff}.tag{margin:0;color:#cfe8f2;font-size:13px;font-weight:900;letter-spacing:.18em}h1{margin:7px 0 0;font-size:35px}header p:last-child{margin:8px 0 0;color:#dce8ed}.body{padding:35px 38px}.center{min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.emoji{font-size:58px;width:104px;height:104px;display:grid;place-items:center;border-radius:50%;background:#e8f1f5}h2{margin:20px 0 9px;font-size:29px}.note{max-width:490px;margin:0;color:#69777e;line-height:1.7;word-break:keep-all}button{font:inherit;cursor:pointer;touch-action:manipulation}.start,.restart{margin-top:27px;border:0;border-radius:18px;padding:16px 38px;background:#dc7957;color:#fff;font-size:18px;font-weight:900}.restart{background:#3c5867}.top{display:flex;align-items:center;gap:16px;margin-bottom:27px}.bar{height:10px;flex:1;overflow:hidden;border-radius:99px;background:#e3e9ec}.fill{height:100%;background:#dc7957;transition:width .3s}.count{white-space:nowrap;color:#64737b;font-weight:900}.prompt{border-radius:24px;background:#f0f5f7;padding:26px;text-align:center}.prompt small{color:#718089;font-weight:800}.korean{margin:11px 0 0;color:#2d4b5b;font-size:25px;font-weight:900;line-height:1.4;word-break:keep-all}.answer-box{min-height:98px;margin-top:20px;border:2px dashed #bccbd2;border-radius:22px;background:#fbfcfd;padding:15px;display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}.placeholder{color:#91a0a7;font-weight:700}.chosen{border:0;border-radius:13px;background:#3c5867;color:#fff;padding:12px 15px;font-weight:850;box-shadow:0 4px 9px #3c586738}.period{font-size:22px;font-weight:900}.pool-label{margin:22px 0 10px;color:#60717a;font-size:13px;font-weight:900}.pool{min-height:125px;border-radius:22px;background:#f7f2eb;padding:19px;display:flex;align-content:center;justify-content:center;gap:10px;flex-wrap:wrap}.block{border:1px solid #dccfbd;border-radius:14px;background:#fff;color:#374149;padding:12px 17px;font-weight:850;box-shadow:0 4px 9px #705f4614;transition:.14s}.block:hover{transform:translateY(-2px);border-color:#c39b77}.block:disabled{opacity:0;pointer-events:none}.message{min-height:30px;margin-top:16px;text-align:center;font-weight:900}.right{color:#168c68}.wrong{color:#da4f62}.tip{text-align:center;margin-top:8px;color:#89969c;font-size:12px}.hidden{display:none!important}.party{font-size:74px}@media(max-width:600px){body{padding:0}.app{min-height:100vh;border:0;border-radius:0}header{padding:23px}.body{padding:25px 19px}h1{font-size:29px}.korean{font-size:22px}.block,.chosen{padding:12px 14px}.pool{padding:14px}}
</style>
</head>
<body>
<main class="app">
<header><p class="tag">30 SENTENCES · WORD BLOCKS</p><h1>영어 문장 블록게임</h1><p>모든 단어를 순서대로 클릭해 문장을 완성하세요.</p></header>
<section class="body">
<div id="intro" class="center"><div class="emoji">🔤</div><h2>30문장 블록게임을 시작해요!</h2><p class="note">우리말 뜻을 읽고 섞인 영어 단어를 하나씩 올바른 순서로 클릭하세요. 선택한 단어를 다시 누르면 취소할 수 있어요.</p><button class="start" type="button" onclick="start()">학습 시작</button></div>
<div id="game" class="hidden"><div class="top"><div class="bar"><div id="fill" class="fill"></div></div><span id="count" class="count"></span></div><div class="prompt"><small>다음 문장을 영어로 완성하세요</small><p id="korean" class="korean"></p></div><div id="answer" class="answer-box"><span class="placeholder">아래 단어를 순서대로 클릭하세요.</span></div><p class="pool-label">WORD BLOCKS</p><div id="pool" class="pool"></div><div id="message" class="message" role="status" aria-live="polite"></div><p class="tip">위 문장 칸의 단어를 누르면 선택을 취소할 수 있습니다.</p></div>
<div id="finish" class="center hidden"><div class="party">🎉</div><h2>30문장을 모두 완성했어요!</h2><p class="note">모든 단어의 순서를 정확하게 익혔습니다.</p><button class="restart" type="button" onclick="restart()">처음부터 다시 하기</button></div>
</section>
</main>
<script>
const questions=[
 {w:["She","is","a","writer"],k:"그녀는 작가이다.",end:"."},
 {w:["Her","movie","is","interesting"],k:"그녀의 영화는 재미있다.",end:"."},
 {w:["The","characters","are","brave"],k:"등장인물들은 용감하다.",end:"."},
 {w:["Her","book","is","about","friendship"],k:"그녀의 책은 우정에 관한 것이다.",end:"."},
 {w:["The","story","will","become","a","movie"],k:"그 이야기는 영화가 될 것이다.",end:"."},
 {w:["She","is","rich"],k:"그녀는 부유하다.",end:"."},
 {w:["Her","story","is","long"],k:"그녀의 이야기는 길다.",end:"."},
 {w:["Her","story","is","interesting"],k:"그녀의 이야기는 재미있다.",end:"."},
 {w:["She","is","from","England"],k:"그녀는 영국 출신이다.",end:"."},
 {w:["The","book","is","for","children"],k:"그 책은 아이들을 위한 것이다.",end:"."},
 {w:["I","like","my","friend"],k:"나는 내 친구를 좋아한다.",end:"."},
 {w:["We","play","computer","games"],k:"우리는 컴퓨터 게임을 한다.",end:"."},
 {w:["We","eat","school","lunch","together"],k:"우리는 학교 급식을 함께 먹는다.",end:"."},
 {w:["She","wears","glasses"],k:"그녀는 안경을 쓴다.",end:"."},
 {w:["We","don't","like","math"],k:"우리는 수학을 좋아하지 않는다.",end:"."},
 {w:["We","like","P.E.","class"],k:"우리는 체육 수업을 좋아한다.",end:"."},
 {w:["He","has","an","older","brother"],k:"그에게는 형이 한 명 있다.",end:"."},
 {w:["She","has","long","hair"],k:"그녀는 머리가 길다.",end:"."},
 {w:["We","study","English","together"],k:"우리는 함께 영어를 공부한다.",end:"."},
 {w:["He","doesn't","like","school","lunch"],k:"그는 학교 급식을 좋아하지 않는다.",end:"."},
 {w:["May","I","order","now"],k:"제가 지금 주문해도 될까요?",end:"?"},
 {w:["I","will","pay","for","lunch"],k:"제가 점심값을 내겠습니다.",end:"."},
 {w:["One","Hawaiian","pizza","to","go","please"],k:"하와이안 피자 한 판 포장해 주세요.",end:".",commaAfter:4},
 {w:["Don't","overeat","at","the","buffet"],k:"뷔페에서 과식하지 마세요.",end:"."},
 {w:["The","restaurant","opens","at","6","p.m."],k:"그 식당은 오후 6시에 문을 엽니다.",end:""},
 {w:["May","I","take","your","order","now"],k:"제가 지금 주문을 받아도 될까요?",end:"?"},
 {w:["I","will","pay","for","Tim","tomorrow"],k:"제가 내일 팀의 식사값을 내겠습니다.",end:"."},
 {w:["Two","cheese","pizzas","to","go","please"],k:"치즈 피자 두 판 포장해 주세요.",end:".",commaAfter:4},
 {w:["I","overeat","at","the","Chinese","restaurant"],k:"나는 그 중국 음식점에서 과식한다.",end:"."},
 {w:["Today's","main","menu","has","changed"],k:"오늘의 주 메뉴가 바뀌었다.",end:"."}
];
let index=0,selected=[],locked=false,blocks=[];const $=id=>document.getElementById(id);
function shuffle(a){const b=[...a];if(b.length<2)return b;do{for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}}while(b.every((x,i)=>x.id===a[i].id));return b}
function start(){$("intro").classList.add("hidden");$("game").classList.remove("hidden");show()}
function show(){locked=false;selected=[];$("count").textContent=(index+1)+" / "+questions.length;$("fill").style.width=(index/questions.length*100)+"%";$("korean").textContent=questions[index].k;$("message").textContent="";$("message").className="message";blocks=shuffle(questions[index].w.map((text,id)=>({text,id})));render()}
function render(){const q=questions[index],answer=$("answer"),pool=$("pool");answer.innerHTML="";pool.innerHTML="";if(!selected.length)answer.innerHTML='<span class="placeholder">아래 단어를 순서대로 클릭하세요.</span>';selected.forEach((x,pos)=>{const b=document.createElement("button");b.type="button";b.className="chosen";b.textContent=x.text;b.onclick=()=>remove(pos);answer.appendChild(b);if(x.id===q.commaAfter){const c=document.createElement("span");c.className="period";c.textContent=",";answer.appendChild(c)}});if(selected.length===blocks.length){const p=document.createElement("span");p.className="period";p.textContent=q.end===undefined?".":q.end;answer.appendChild(p)}blocks.forEach(x=>{const b=document.createElement("button");b.type="button";b.className="block";b.textContent=x.text;b.disabled=selected.some(s=>s.id===x.id);b.onclick=()=>choose(x);pool.appendChild(b)})}
function choose(x){if(locked)return;selected.push(x);render();if(selected.length===blocks.length)check()}
function remove(pos){if(locked)return;selected.splice(pos,1);$("message").textContent="";render()}
function check(){locked=true;const made=selected.map(x=>x.text).join(" ");const correct=questions[index].w.join(" ");if(made===correct){$("message").textContent="정답이에요! 문장을 완성했어요. ✨";$("message").className="message right";setTimeout(()=>{if(index===questions.length-1){$("game").classList.add("hidden");$("finish").classList.remove("hidden")}else{index++;show()}},900)}else{$("message").textContent="순서가 달라요. 다시 풀어 보세요.";$("message").className="message wrong";setTimeout(()=>{selected=[];locked=false;render();$("message").textContent=""},1100)}}
function restart(){index=0;$("finish").classList.add("hidden");$("game").classList.remove("hidden");show()}
</script>
</body>
</html>
