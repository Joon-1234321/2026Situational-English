<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리말 보고 영어 문장 쓰기</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px;background:radial-gradient(circle at top,#fbfcfa,#edf2ef 62%,#e4ebe7);font-family:Arial,"Noto Sans KR",sans-serif;color:#28352f;-webkit-tap-highlight-color:transparent}.app{max-width:860px;margin:auto;background:#fff;border:1px solid #dce6df;border-radius:32px;overflow:hidden;box-shadow:0 18px 50px #52635a24}header{padding:27px 38px;background:#3d5f52;color:#fff}.tag{margin:0;color:#d3eee2;font-size:13px;font-weight:900;letter-spacing:.18em}h1{margin:7px 0 0;font-size:34px}header p:last-child{margin:8px 0 0;color:#e1eee8}.body{padding:32px 38px 38px}.center{min-height:540px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.emoji{font-size:58px;width:104px;height:104px;display:grid;place-items:center;border-radius:50%;background:#e9f2ed}h2{margin:20px 0 9px;font-size:29px}.note{max-width:560px;margin:0;color:#69776f;line-height:1.7;word-break:keep-all}button{font:inherit;cursor:pointer;touch-action:manipulation}.start,.restart{margin-top:27px;border:0;border-radius:18px;padding:16px 38px;background:#d97855;color:#fff;font-size:18px;font-weight:900}.restart{background:#3d5f52}.top{display:flex;align-items:center;gap:16px;margin-bottom:24px}.bar{height:10px;flex:1;overflow:hidden;border-radius:99px;background:#e3eae6}.fill{height:100%;background:#d97855;transition:width .3s}.count{white-space:nowrap;color:#64736b;font-weight:900}.prompt{border-radius:24px;background:#f0f6f2;padding:24px;text-align:center}.prompt small{color:#718078;font-weight:800}.korean{margin:10px 0 0;color:#2d5142;font-size:25px;font-weight:900;line-height:1.4;word-break:keep-all}.label{display:block;margin:20px 0 9px;color:#607168;font-size:13px;font-weight:900}.display{min-height:66px;border:2px solid #b9c9c0;border-radius:18px;background:#fff;padding:17px 18px;color:#28352f;font-size:21px;font-weight:800;line-height:1.45;word-break:break-word;box-shadow:inset 0 2px 4px #33493f0b}.display.empty{color:#93a098;font-weight:600}.display.error{border-color:#d96876;background:#fff8f9}.display.success{border-color:#39a37d;background:#f4fcf8}.caret{display:inline-block;width:2px;height:1.1em;margin-left:3px;vertical-align:-.15em;background:#d97855;animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.guide{margin:8px 0 0;text-align:center;color:#86938c;font-size:12px}.hint{margin-top:15px;border:1px solid #ead8b9;border-radius:18px;background:#fff9ed;padding:15px;text-align:center}.hint p{margin:0;color:#82653a;font-size:13px;font-weight:800}.hint-words{margin-top:7px!important;color:#6f522a!important;font-size:18px!important;line-height:1.5}.feedback{min-height:29px;margin-top:12px;text-align:center;font-weight:900}.right{color:#168c68}.wrong{color:#d94f61}.tries{text-align:center;color:#8a9790;font-size:12px;min-height:18px}.keyboard{margin-top:17px;padding:14px;border-radius:22px;background:#eef2f0;user-select:none}.key-row{display:flex;justify-content:center;gap:7px;margin:7px 0}.key{min-width:52px;height:49px;border:1px solid #cbd6d0;border-radius:11px;background:#fff;color:#33433b;font-size:18px;font-weight:850;box-shadow:0 3px 0 #c5cfca;transition:transform .06s,box-shadow .06s,background .12s}.key:active{transform:translateY(2px);box-shadow:0 1px 0 #c5cfca}.key.action{background:#dbe5e0;color:#365348;font-size:15px}.key.shift.active{background:#3d5f52;color:#fff}.key.space{flex:1;max-width:360px}.key.check{min-width:112px;background:#d97855;border-color:#d97855;color:#fff;box-shadow:0 3px 0 #b95f40}.key:disabled{opacity:.55;cursor:default}.hidden{display:none!important}.party{font-size:74px}@media(max-width:700px){body{padding:0}.app{min-height:100vh;border:0;border-radius:0}header{padding:21px 19px}.body{padding:23px 13px 28px}h1{font-size:28px}.korean{font-size:22px}.keyboard{padding:9px 5px;border-radius:18px}.key-row{gap:4px;margin:5px 0}.key{min-width:0;flex:1;height:47px;padding:0 2px;border-radius:9px;font-size:17px}.key-row:nth-child(2){padding:0 4%}.key-row:nth-child(3){padding:0 1%}.key.action{font-size:12px}.key.space{max-width:none;flex:2.8}.key.check{min-width:0;flex:1.5}.display{font-size:19px}}
</style>
</head>
<body>
<main class="app">
<header><p class="tag">KOREAN → ENGLISH</p><h1>우리말 보고 영어 문장 쓰기</h1><p>화면 키보드로 영어 문장을 완성하세요.</p></header>
<section class="body">
<div id="intro" class="center"><div class="emoji">⌨️</div><h2>영작 타이핑을 시작해요!</h2><p class="note">우리말 뜻을 보고 화면의 영문 키보드로 문장을 입력하세요. 일반 입력창을 사용하지 않아 자동완성이나 추천 단어가 나타나지 않습니다.</p><button class="start" type="button" onclick="start()">학습 시작</button></div>
<div id="game" class="hidden">
  <div class="top"><div class="bar"><div id="fill" class="fill"></div></div><span id="count" class="count"></span></div>
  <div class="prompt"><small>다음 문장을 영어로 쓰세요</small><p id="korean" class="korean"></p></div>
  <span class="label">영어 문장 입력</span>
  <div id="display" class="display empty" role="textbox" aria-label="입력한 영어 문장" aria-live="polite"><span id="answerText">영어 문장을 입력하세요</span><span class="caret"></span></div>
  <p class="guide">대소문자와 마지막 마침표는 채점에 영향을 주지 않습니다.</p>
  <div id="hint" class="hint hidden"><p>단어를 올바른 순서로 배열해 입력하세요.</p><p id="hintWords" class="hint-words"></p></div>
  <div id="message" class="feedback" role="status" aria-live="assertive"></div>
  <div id="tries" class="tries"></div>
  <div id="keyboard" class="keyboard" aria-label="화면 영문 키보드"></div>
</div>
<div id="finish" class="center hidden"><div class="party">🎉</div><h2>10문장을 모두 완성했어요!</h2><p class="note">우리말 뜻을 보고 영어 문장을 정확하게 썼습니다.</p><button class="restart" type="button" onclick="restart()">처음부터 다시 하기</button></div>
</section>
</main>
<script>
const questions=[
 {a:"He trains every day.",k:"그는 매일 훈련한다."},
 {a:"He smiles happily.",k:"그는 행복하게 미소 짓는다."},
 {a:"He never gives up.",k:"그는 절대 포기하지 않는다."},
 {a:"He moved to Germany.",k:"그는 독일로 이사했다."},
 {a:"He will return to Korea.",k:"그는 한국으로 돌아올 것이다."},
 {a:"He always wins.",k:"그는 항상 이긴다."},
 {a:"He trains with team members.",k:"그는 팀원들과 함께 훈련한다."},
 {a:"He went to Germany.",k:"그는 독일에 갔다."},
 {a:"His team returned to Korea.",k:"그의 팀은 한국으로 돌아왔다."},
 {a:"He appears in many ads.",k:"그는 많은 광고에 등장한다."}
];
const rows=["qwertyuiop","asdfghjkl","zxcvbnm"];
let index=0,typed="",mistakes=0,shift=true,busy=false,hintOrder=[];const $=id=>document.getElementById(id);
function start(){$("intro").classList.add("hidden");$("game").classList.remove("hidden");show()}
function normalize(s){return s.toLowerCase().trim().replace(/[.!?]+$/g,"").replace(/\s+/g," ")}
function shuffledWords(sentence){const original=sentence.replace(/[.!?]+$/g,"").split(/\s+/).map((text,id)=>({text,id}));const mixed=[...original];if(mixed.length>1){do{for(let i=mixed.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[mixed[i],mixed[j]]=[mixed[j],mixed[i]]}}while(mixed.every((x,i)=>x.id===original[i].id))}return mixed.map(x=>x.text)}
function show(){typed="";mistakes=0;shift=true;busy=false;hintOrder=shuffledWords(questions[index].a);$("count").textContent=(index+1)+" / "+questions.length;$("fill").style.width=(index/questions.length*100)+"%";$("korean").textContent=questions[index].k;$("hint").classList.add("hidden");$("hintWords").textContent="";$("message").textContent="";$("message").className="feedback";$("tries").textContent="";$("display").className="display empty";renderAnswer();renderKeyboard()}
function renderAnswer(){const text=$("answerText");text.textContent=typed||"영어 문장을 입력하세요";$("display").classList.toggle("empty",!typed)}
function makeKey(label,action,className=""){const b=document.createElement("button");b.type="button";b.className="key "+className;b.textContent=label;b.disabled=busy;b.onclick=action;return b}
function renderKeyboard(){const kb=$("keyboard");kb.innerHTML="";rows.forEach((letters,rowIndex)=>{const row=document.createElement("div");row.className="key-row";if(rowIndex===2)row.appendChild(makeKey("⇧",toggleShift,"action shift"+(shift?" active":"")));[...letters].forEach(letter=>row.appendChild(makeKey(shift?letter.toUpperCase():letter,()=>insertLetter(letter))));if(rowIndex===2)row.appendChild(makeKey("⌫",backspace,"action"));kb.appendChild(row)});const actions=document.createElement("div");actions.className="key-row";actions.appendChild(makeKey("지우기",clearAll,"action"));actions.appendChild(makeKey("띄어쓰기",()=>insertText(" "),"action space"));actions.appendChild(makeKey(".",()=>insertText("."),"action"));actions.appendChild(makeKey("확인 ↵",check,"check"));kb.appendChild(actions)}
function toggleShift(){if(busy)return;shift=!shift;renderKeyboard()}
function insertLetter(letter){if(busy)return;typed+=(shift?letter.toUpperCase():letter);if(shift)shift=false;clearError();renderAnswer();renderKeyboard()}
function insertText(text){if(busy)return;if(text===" "&&(!typed||typed.endsWith(" ")))return;if(text==="."&&typed.endsWith("."))return;typed+=text;clearError();renderAnswer()}
function backspace(){if(busy||!typed)return;typed=typed.slice(0,-1);clearError();renderAnswer()}
function clearAll(){if(busy)return;typed="";shift=true;clearError();renderAnswer();renderKeyboard()}
function clearError(){$("display").classList.remove("error");$("message").textContent="";$("message").className="feedback"}
function check(){if(busy||!typed.trim())return;if(normalize(typed)===normalize(questions[index].a)){busy=true;$("display").className="display success";$("message").textContent="정답이에요! 다음 문제로 넘어갑니다. ✨";$("message").className="feedback right";renderKeyboard();setTimeout(()=>{if(index===questions.length-1){$("game").classList.add("hidden");$("finish").classList.remove("hidden")}else{index++;show()}},900)}else{mistakes++;$("display").classList.add("error");$("message").textContent="아쉬워요. 문장을 고쳐서 다시 확인해 보세요.";$("message").className="feedback wrong";$("tries").textContent="현재 문제 오답 횟수: "+mistakes+"회";if(mistakes>=3){$("hintWords").textContent=hintOrder.join("  /  ");$("hint").classList.remove("hidden")}}}
function restart(){index=0;$("finish").classList.add("hidden");$("game").classList.remove("hidden");show()}
document.addEventListener("keydown",e=>{if($("game").classList.contains("hidden")||busy)return;if(e.key.length===1&&/[a-zA-Z]/.test(e.key)){insertLetter(e.key.toLowerCase());e.preventDefault()}else if(e.key===" "){insertText(" ");e.preventDefault()}else if(e.key==="."){insertText(".");e.preventDefault()}else if(e.key==="Backspace"){backspace();e.preventDefault()}else if(e.key==="Enter"){check();e.preventDefault()}});
</script>
</body>
</html>
