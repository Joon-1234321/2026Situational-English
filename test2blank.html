<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>30문장 랜덤 빈칸 타이핑</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px 13px;background:radial-gradient(circle at top,#fbfcfa,#edf2ef 62%,#e4ebe7);font-family:Arial,"Noto Sans KR",sans-serif;color:#29352f;-webkit-tap-highlight-color:transparent}.app{max-width:860px;margin:auto;background:#fff;border:1px solid #dce6df;border-radius:30px;overflow:hidden;box-shadow:0 18px 50px #52635a24}header{padding:25px 36px;background:#3d5f52;color:#fff}.tag{margin:0;color:#d3eee2;font-size:13px;font-weight:900;letter-spacing:.15em}h1{margin:7px 0 0;font-size:32px}header p:last-child{margin:8px 0 0;color:#e1eee8}.body{padding:30px 36px 38px}.center{min-height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.emoji{font-size:56px;width:102px;height:102px;display:grid;place-items:center;border-radius:50%;background:#e9f2ed}h2{margin:19px 0 9px;font-size:29px}.note{max-width:590px;margin:0;color:#69776f;line-height:1.7;word-break:keep-all}button{font:inherit;cursor:pointer;touch-action:manipulation}.start,.restart{margin-top:26px;border:0;border-radius:18px;padding:15px 34px;background:#d97855;color:#fff;font-size:18px;font-weight:900}.restart{background:#3d5f52}.top{display:flex;align-items:center;gap:14px;margin-bottom:20px}.bar{height:10px;flex:1;overflow:hidden;border-radius:99px;background:#e3eae6}.fill{height:100%;background:#d97855;transition:width .3s}.count{white-space:nowrap;color:#64736b;font-weight:900}.prompt{border-radius:22px;background:#f0f6f2;padding:20px;text-align:center}.prompt small{color:#718078;font-weight:800}.korean{margin:8px 0 0;color:#2d5142;font-size:21px;font-weight:900;line-height:1.4;word-break:keep-all}.sentence-card{margin-top:13px;border:1px solid #d8e3dc;border-radius:22px;background:#fbfcfb;padding:23px 16px;text-align:center}.sentence{margin:0;color:#2c3933;font-size:24px;font-weight:850;line-height:1.8;word-break:keep-all}.blank{display:inline-block;min-width:94px;margin:0 3px;padding:0 8px;border-bottom:4px solid #d97855;color:#d97855;letter-spacing:.08em}.label{display:block;margin:17px 0 8px;color:#607168;font-size:13px;font-weight:900}.display{min-height:62px;border:2px solid #b9c9c0;border-radius:18px;background:#fff;padding:15px 18px;text-align:center;color:#28352f;font-size:21px;font-weight:850}.display.empty{color:#93a098;font-weight:600}.display.error{border-color:#d96876;background:#fff8f9}.display.success{border-color:#39a37d;background:#f4fcf8}.caret{display:inline-block;width:2px;height:1.05em;margin-left:3px;vertical-align:-.14em;background:#d97855;animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.guide{margin:7px 0 0;text-align:center;color:#86938c;font-size:12px}.hint{margin-top:13px;border:1px solid #ead8b9;border-radius:17px;background:#fff9ed;padding:13px;text-align:center;color:#765a31;font-weight:800}.feedback{min-height:27px;margin-top:10px;text-align:center;font-weight:900}.right{color:#168c68}.wrong{color:#d94f61}.tries{text-align:center;color:#89958f;font-size:12px;min-height:17px}.keyboard{margin-top:14px;padding:13px;border-radius:22px;background:#eef2f0;user-select:none}.key-row{display:flex;justify-content:center;gap:7px;margin:7px 0}.key{min-width:52px;height:48px;border:1px solid #cbd6d0;border-radius:11px;background:#fff;color:#33433b;font-size:18px;font-weight:850;box-shadow:0 3px 0 #c5cfca}.key:active{transform:translateY(2px);box-shadow:0 1px 0 #c5cfca}.key.action{background:#dbe5e0;color:#365348;font-size:14px}.key.check{min-width:122px;background:#d97855;border-color:#d97855;color:#fff;box-shadow:0 3px 0 #b95f40}.key:disabled{opacity:.55}.finish-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(470px,100%);margin-top:20px}.stat{border-radius:17px;background:#f0f6f2;padding:14px;color:#718078;font-size:12px;font-weight:800}.stat strong{display:block;margin-top:4px;color:#2d5142;font-size:22px}.hidden{display:none!important}.party{font-size:70px}@media(max-width:700px){body{padding:0}.app{min-height:100vh;border:0;border-radius:0}header{padding:20px 18px}.body{padding:22px 12px 28px}h1{font-size:27px}.korean{font-size:20px}.sentence{font-size:20px}.blank{min-width:76px}.keyboard{padding:9px 4px;border-radius:18px}.key-row{gap:4px;margin:5px 0}.key{min-width:0;flex:1;height:47px;padding:0 2px;border-radius:9px;font-size:17px}.key-row:nth-child(2){padding:0 4%}.key-row:nth-child(3){padding:0 1%}.key.action{font-size:11px}.key.check{min-width:0;flex:1.5}}
</style>
</head>
<body>
<main class="app">
<header><p class="tag">ONE BLANK · RANDOM PRACTICE</p><h1>영어 문장 빈칸 타이핑</h1><p>빈칸에 들어갈 영어 단어를 입력하세요.</p></header>
<section class="body">
<div id="intro" class="center"><div class="emoji">✏️</div><h2>30문장 빈칸 연습</h2><p class="note">영어 문장에는 빈칸이 하나만 나옵니다. 화면 키보드로 알맞은 단어를 입력하세요. 학습을 다시 시작하면 각 문장의 빈칸이 이전과 다른 위치로 바뀝니다.</p><button class="start" type="button" onclick="startGame()">학습 시작</button></div>
<div id="game" class="hidden">
 <div class="top"><div class="bar"><div id="fill" class="fill"></div></div><span id="count" class="count"></span></div>
 <div class="prompt"><small>우리말 뜻</small><p id="korean" class="korean"></p></div>
 <div class="sentence-card"><p id="sentence" class="sentence"></p></div>
 <span class="label">빈칸에 들어갈 단어</span>
 <div id="display" class="display empty" role="textbox" aria-label="입력한 영어 단어" aria-live="polite"><span id="answerText">영어 단어를 입력하세요</span><span class="caret"></span></div>
 <p class="guide">대소문자는 채점에 영향을 주지 않습니다.</p>
 <div id="hint" class="hint hidden"></div>
 <div id="message" class="feedback" role="status" aria-live="assertive"></div><div id="tries" class="tries"></div>
 <div id="keyboard" class="keyboard" aria-label="자동완성 방지 화면 키보드"></div>
</div>
<div id="finish" class="center hidden"><div class="party">🎉</div><h2>30문장을 모두 완성했어요!</h2><p class="note">아래 버튼을 누르면 같은 문장에 새로운 빈칸이 나옵니다.</p><div class="finish-stats"><div class="stat">한 번에 정답<strong id="perfectCount">0개</strong></div><div class="stat">전체 오답<strong id="mistakeCount">0회</strong></div></div><button class="restart" type="button" onclick="restartGame()">새 빈칸으로 다시 풀기</button></div>
</section>
</main>
<script>
const questions=[
 {w:["She","is","a","writer"],c:[1,2,3],k:"그녀는 작가이다.",end:"."},
 {w:["Her","movie","is","interesting"],c:[1,2,3],k:"그녀의 영화는 재미있다.",end:"."},
 {w:["The","characters","are","brave"],c:[1,2,3],k:"등장인물들은 용감하다.",end:"."},
 {w:["Her","book","is","about","friendship"],c:[1,2,3,4],k:"그녀의 책은 우정에 관한 것이다.",end:"."},
 {w:["The","story","will","become","a","movie"],c:[1,2,3,4,5],k:"그 이야기는 영화가 될 것이다.",end:"."},
 {w:["She","is","rich"],c:[1,2],k:"그녀는 부유하다.",end:"."},
 {w:["Her","story","is","long"],c:[1,2,3],k:"그녀의 이야기는 길다.",end:"."},
 {w:["Her","story","is","interesting"],c:[1,2,3],k:"그녀의 이야기는 재미있다.",end:"."},
 {w:["She","is","from","England"],c:[1,2,3],k:"그녀는 영국 출신이다.",end:"."},
 {w:["The","book","is","for","children"],c:[1,2,3,4],k:"그 책은 아이들을 위한 것이다.",end:"."},
 {w:["I","like","my","friend"],c:[1,2,3],k:"나는 내 친구를 좋아한다.",end:"."},
 {w:["We","play","computer","games"],c:[1,2,3],k:"우리는 컴퓨터 게임을 한다.",end:"."},
 {w:["We","eat","school","lunch","together"],c:[1,2,3,4],k:"우리는 학교 급식을 함께 먹는다.",end:"."},
 {w:["She","wears","glasses"],c:[1,2],k:"그녀는 안경을 쓴다.",end:"."},
 {w:["We","don't","like","math"],c:[1,2,3],k:"우리는 수학을 좋아하지 않는다.",end:"."},
 {w:["We","like","P.E.","class"],c:[1,3],k:"우리는 체육 수업을 좋아한다.",end:"."},
 {w:["He","has","an","older","brother"],c:[1,2,3,4],k:"그에게는 형이 한 명 있다.",end:"."},
 {w:["She","has","long","hair"],c:[1,2,3],k:"그녀는 머리가 길다.",end:"."},
 {w:["We","study","English","together"],c:[1,2,3],k:"우리는 함께 영어를 공부한다.",end:"."},
 {w:["He","doesn't","like","school","lunch"],c:[1,2,3,4],k:"그는 학교 급식을 좋아하지 않는다.",end:"."},
 {w:["May","I","order","now"],c:[0,2,3],k:"제가 지금 주문해도 될까요?",end:"?"},
 {w:["I","will","pay","for","lunch"],c:[1,2,3,4],k:"제가 점심값을 내겠습니다.",end:"."},
 {w:["One","Hawaiian","pizza","to","go","please"],c:[1,2,3,4,5],k:"하와이안 피자 한 판 포장해 주세요.",end:".",commaAfter:4},
 {w:["Don't","overeat","at","the","buffet"],c:[0,1,2,3,4],k:"뷔페에서 과식하지 마세요.",end:"."},
 {w:["The","restaurant","opens","at","6","p.m."],c:[1,2,3],k:"그 식당은 오후 6시에 문을 엽니다.",end:""},
 {w:["May","I","take","your","order","now"],c:[0,2,3,4,5],k:"제가 지금 주문을 받아도 될까요?",end:"?"},
 {w:["I","will","pay","for","Tim","tomorrow"],c:[1,2,3,4,5],k:"제가 내일 팀의 식사값을 내겠습니다.",end:"."},
 {w:["Two","cheese","pizzas","to","go","please"],c:[1,2,3,4,5],k:"치즈 피자 두 판 포장해 주세요.",end:".",commaAfter:4},
 {w:["I","overeat","at","the","Chinese","restaurant"],c:[1,2,3,4,5],k:"나는 그 중국 음식점에서 과식한다.",end:"."},
 {w:["Today's","main","menu","has","changed"],c:[1,2,3,4],k:"오늘의 주 메뉴가 바뀌었다.",end:"."}
];
const rows=["qwertyuiop","asdfghjkl","zxcvbnm"],storageKey="english30_last_blanks_v1",$=id=>document.getElementById(id);
let index=0,typed="",mistakes=0,totalMistakes=0,perfect=0,busy=false,blanks=[]; 
function normalize(s){return s.toLowerCase().trim().replace(/[’‘]/g,"'")}
function chooseBlanks(){let previous=[];try{previous=JSON.parse(localStorage.getItem(storageKey)||"[]")}catch(e){}blanks=questions.map((q,i)=>{const choices=q.c.filter(x=>x!==previous[i]),pool=choices.length?choices:q.c;return pool[Math.floor(Math.random()*pool.length)]});try{localStorage.setItem(storageKey,JSON.stringify(blanks))}catch(e){}}
function startGame(){chooseBlanks();index=0;totalMistakes=0;perfect=0;$("intro").classList.add("hidden");$("finish").classList.add("hidden");$("game").classList.remove("hidden");showQuestion()}
function showQuestion(){typed="";mistakes=0;busy=false;$("count").textContent=(index+1)+" / "+questions.length;$("fill").style.width=(index/questions.length*100)+"%";$("korean").textContent=questions[index].k;$("message").textContent="";$("message").className="feedback";$("tries").textContent="";$("hint").classList.add("hidden");$("display").className="display empty";renderSentence();renderAnswer();renderKeyboard()}
function renderSentence(){const q=questions[index],blankIndex=blanks[index],box=$("sentence");box.innerHTML="";q.w.forEach((word,i)=>{if(i>0)box.appendChild(document.createTextNode(" "));if(i===blankIndex){const b=document.createElement("span");b.className="blank";b.textContent="_____";box.appendChild(b)}else box.appendChild(document.createTextNode(word));if(i===q.commaAfter)box.appendChild(document.createTextNode(","))});box.appendChild(document.createTextNode(q.end===undefined?".":q.end))}
function renderAnswer(){$("answerText").textContent=typed||"영어 단어를 입력하세요";$("display").classList.toggle("empty",!typed)}
function makeKey(label,action,extra=""){const b=document.createElement("button");b.type="button";b.className="key "+extra;b.textContent=label;b.disabled=busy;b.onclick=action;return b}
function renderKeyboard(){const kb=$("keyboard");kb.innerHTML="";rows.forEach((letters,rowIndex)=>{const row=document.createElement("div");row.className="key-row";[...letters].forEach(letter=>row.appendChild(makeKey(letter,()=>insert(letter))));if(rowIndex===2)row.appendChild(makeKey("⌫",backspace,"action"));kb.appendChild(row)});const actions=document.createElement("div");actions.className="key-row";actions.append(makeKey("지우기",clearAll,"action"),makeKey("'",()=>insert("'"),"action"),makeKey("확인 ↵",checkAnswer,"check"));kb.appendChild(actions)}
function insert(text){if(busy)return;typed+=text;clearError();renderAnswer()}
function backspace(){if(busy||!typed)return;typed=typed.slice(0,-1);clearError();renderAnswer()}
function clearAll(){if(busy)return;typed="";clearError();renderAnswer()}
function clearError(){$("display").classList.remove("error");$("message").textContent="";$("message").className="feedback"}
function shuffledLetters(word){const chars=[...word.toLowerCase()],mixed=[...chars];if(chars.length>1){for(let n=0;n<8&&mixed.join("")===chars.join("");n++)for(let i=mixed.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[mixed[i],mixed[j]]=[mixed[j],mixed[i]]}}return mixed.join(" · ")}
function checkAnswer(){if(busy||!typed.trim())return;const answer=questions[index].w[blanks[index]];if(normalize(typed)===normalize(answer)){busy=true;if(mistakes===0)perfect++;$("display").className="display success";$("message").textContent="정답이에요! "+answer+" ✨";$("message").className="feedback right";renderKeyboard();setTimeout(()=>{if(index===questions.length-1)finishGame();else{index++;showQuestion()}},900)}else{mistakes++;totalMistakes++;$("display").classList.add("error");$("message").textContent="아쉬워요. 다시 입력해 보세요.";$("message").className="feedback wrong";$("tries").textContent="현재 문제 오답 횟수: "+mistakes+"회";if(mistakes>=3){$("hint").textContent="철자 힌트: "+shuffledLetters(answer)+"  ·  "+answer.length+"글자";$("hint").classList.remove("hidden")}}}
function finishGame(){$("game").classList.add("hidden");$("finish").classList.remove("hidden");$("perfectCount").textContent=perfect+"개";$("mistakeCount").textContent=totalMistakes+"회";window.scrollTo({top:0,behavior:"smooth"})}
function restartGame(){chooseBlanks();index=0;totalMistakes=0;perfect=0;$("finish").classList.add("hidden");$("game").classList.remove("hidden");showQuestion()}
document.addEventListener("keydown",e=>{if($("game").classList.contains("hidden")||busy)return;if(e.key.length===1&&/[a-zA-Z]/.test(e.key)){insert(e.key.toLowerCase());e.preventDefault()}else if(e.key==="'"||e.key==="’"){insert("'");e.preventDefault()}else if(e.key==="Backspace"){backspace();e.preventDefault()}else if(e.key==="Enter"){checkAnswer();e.preventDefault()}});
</script>
</body>
</html>
